<title>Mahomie's Hub v1.8</title>
<meta name="theme-color" content="#130f1d">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* Layout: sticky brand bar, slate hero with grid, color-bar tiles, 5-tab bar, bottom sheets), re-skinned in the night-street palette: deep violet-graphite ground, gold lead, neon pink + cyan support, Chakra Petch display, Plex Sans body, Plex Mono labels. Single committed dark look. */
:root{
  color-scheme:dark;
  --ground:#130f1d; --ground-2:#0d0a15;
  --panel:#1c1729; --panel-2:#241d35; --panel-3:#2d2542;
  --line:#352b4d; --line-2:#4a3d69;
  --ink:#efe9fb; --muted:#a59cc0; --faint:#7d7499;
  --gold:#f6cf4c; --gold-2:#e7b92f; --gold-ink:#1a1405;
  --pink:#ff5fd6; --cyan:#4cecff;
  --win:#5dff8f; --loss:#ff5470;
  --display:"Chakra Petch","Bahnschrift","Segoe UI",sans-serif;
  --body:"IBM Plex Sans","Segoe UI",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
  --rule:linear-gradient(90deg,var(--gold),var(--pink) 55%,var(--cyan));
  --tab-h:62px;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--ground);color:var(--ink);font-family:var(--body);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
body{min-height:100%;background:radial-gradient(120% 50% at 50% -10%,#2a1d45 0%,var(--ground) 60%) fixed,var(--ground)}
button{font:inherit;color:inherit;cursor:pointer}
h1,h2,h3{margin:0;text-wrap:balance;font-family:var(--display)}
p{margin:0}
.num{font-variant-numeric:tabular-nums}
:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}

/* top bar */
.topbar{position:relative;z-index:30;padding-top:calc(10px + env(safe-area-inset-top,0px)) !important;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 16px 12px;background:rgba(19,15,29,.92);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
body::before{content:"";position:fixed;top:0;left:0;right:0;height:env(safe-area-inset-top,0px);background:var(--ground);z-index:80;pointer-events:none}
.topbar::after{content:"";position:absolute;left:0;right:0;bottom:0;height:2px;background:var(--rule);opacity:.9}
.brand{display:flex;align-items:center;gap:9px;min-width:0}
.mark{width:34px;height:34px;border-radius:9px;flex:0 0 auto;box-shadow:0 0 0 1px var(--line-2),0 0 18px rgba(246,207,76,.18)}
.bname{font-family:var(--display);font-size:18px;font-weight:700;letter-spacing:.02em;line-height:1;color:var(--ink);white-space:nowrap}
.bname b{color:var(--gold);font-weight:700}
.bsub{font:500 9px var(--mono);letter-spacing:.16em;color:var(--muted);margin-top:4px;white-space:nowrap}
.bucks{display:flex;align-items:center;gap:6px;padding:6px 10px;border-radius:6px;border:1px solid var(--gold-2);background:rgba(246,207,76,.10);color:var(--gold);font:600 13px var(--mono);white-space:nowrap}

/* layout */
main{max-width:720px;margin:0 auto;padding-inline:12px;padding-block:14px calc(var(--tab-h) + env(safe-area-inset-bottom,0px) + 24px);display:grid;gap:12px}
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:40;display:grid;grid-template-columns:repeat(5,1fr);padding-bottom:env(safe-area-inset-bottom,0px);background:rgba(13,10,21,.96);border-top:1px solid var(--line);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
.tab{height:var(--tab-h);border:0;background:none;display:grid;place-items:center;align-content:center;gap:3px;color:var(--faint);font:500 10px var(--mono);letter-spacing:.08em;text-transform:uppercase;position:relative}
.tab svg{width:23px;height:23px}
.tab.on{color:var(--gold)}
.tab.on::before{content:"";position:absolute;top:0;left:28%;right:28%;height:2px;background:var(--rule);box-shadow:0 0 10px rgba(255,95,214,.6)}

/* hero */
.hero{position:relative;overflow:hidden;padding:18px 15px 15px;border:1px solid var(--line-2);border-radius:14px;color:var(--ink);
  background:radial-gradient(circle at 92% 0%,rgba(76,236,255,.16),transparent 34%),radial-gradient(circle at 0% 100%,rgba(255,95,214,.16),transparent 40%),linear-gradient(140deg,#2a2140 0%,#1c1729 55%,#150f22 100%);box-shadow:0 12px 30px rgba(0,0,0,.35)}
.hero::before{content:"";position:absolute;inset:0;pointer-events:none;opacity:.5;background-image:linear-gradient(rgba(76,236,255,.06) 1px,transparent 1px),linear-gradient(90deg,rgba(255,95,214,.05) 1px,transparent 1px);background-size:28px 28px}
.hero::after{content:"";position:absolute;left:0;right:0;top:0;height:3px;background:var(--rule)}
.hero>*{position:relative}
.eyebrow{font:500 11px var(--mono);letter-spacing:.16em;text-transform:uppercase;color:var(--cyan)}
.hero h1{color:var(--ink);font-size:36px;font-weight:700;letter-spacing:.01em;line-height:1;margin:8px 0 6px}
.hero .sub{color:var(--muted);font-size:13.5px;line-height:1.5}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}
.tile{position:relative;overflow:hidden;padding:11px 11px 10px;border:1px solid var(--line);border-radius:10px;background:rgba(13,10,21,.55);text-align:left;color:inherit;min-width:0}
.tile::before{content:"";position:absolute;top:0;left:0;right:0;height:2px}
.t-y::before{background:var(--gold)}.t-b::before{background:var(--cyan)}.t-g::before{background:var(--win)}.t-r::before{background:var(--pink)}.t-k::before{background:var(--faint)}
.tile small{display:block;font:500 9.5px var(--mono);letter-spacing:.12em;color:var(--muted);text-transform:uppercase}
.tile strong{display:block;font:700 26px var(--display);margin-top:4px;line-height:1.05;font-variant-numeric:tabular-nums}
.t-y strong{color:var(--gold)}.t-b strong{color:var(--cyan)}.t-g strong{color:var(--win)}.t-r strong{color:var(--pink)}
.tile span{display:block;color:var(--muted);font-size:12px;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* panels */
.panel{padding:14px;border:1px solid var(--line);border-radius:12px;background:var(--panel);min-width:0}
.ph{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;margin-bottom:10px}
.kicker{font:500 10px var(--mono);letter-spacing:.14em;color:var(--cyan);text-transform:uppercase}
.ph h2{font-size:21px;font-weight:700;color:var(--ink);letter-spacing:.01em;margin-top:3px}
.link{border:0;background:none;color:var(--gold);font:500 11px var(--mono);letter-spacing:.08em;text-transform:uppercase;padding:6px 0;white-space:nowrap}
.note{font-size:12.5px;line-height:1.5;padding:9px 11px;border-radius:8px;border:1px dashed var(--gold-2);background:rgba(246,207,76,.06);color:var(--ink)}
.note b{color:var(--gold)}
.muted{color:var(--muted)}

/* avatar + who */
.av{flex:0 0 auto;display:grid;place-items:center;border-radius:8px;font-family:var(--display);font-weight:700;color:var(--ground-2);letter-spacing:.02em}
.who{display:flex;align-items:center;gap:9px;min-width:0;border:0;background:none;padding:0;text-align:left;color:inherit}
.who .tx{min-width:0}
.who .tx>b{display:block;font-size:14px;font-weight:600;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.who .tx>span{display:block;font:12px var(--mono);color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.rows{display:grid}
.row{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.row:first-child{border-top:0;padding-top:2px}
.val{font:700 18px var(--display);text-align:right;font-variant-numeric:tabular-nums;color:var(--ink)}
.val small{display:block;font:500 10px var(--mono);letter-spacing:.08em;color:var(--faint);text-transform:uppercase}
.rk{width:24px;height:24px;border-radius:6px;border:1px solid var(--line-2);color:var(--muted);display:grid;place-items:center;font:600 11px var(--mono);flex:0 0 auto}
.rk.gold{background:var(--gold);border-color:var(--gold);color:var(--gold-ink)}

.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;padding:3px;border:1px solid var(--line);border-radius:9px;background:var(--ground-2);gap:2px}
.seg button{border:0;background:none;min-height:38px;border-radius:6px;font:500 11.5px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.seg button.on{background:var(--panel-3);color:var(--gold);box-shadow:inset 0 -2px 0 var(--gold)}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none;margin-inline:-12px;padding-inline:12px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;border:1px solid var(--line-2);background:var(--panel);border-radius:6px;padding:8px 11px;font:500 11.5px var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);white-space:nowrap}
.chip.on{border-color:var(--pink);color:var(--pink);background:rgba(255,95,214,.08)}

/* book cards */
.mu{border:1px solid var(--line);border-radius:12px;background:var(--panel);overflow:hidden}
.mu-h{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 12px;background:var(--ground-2);border-bottom:1px solid var(--line);font:500 10.5px var(--mono);letter-spacing:.12em;color:var(--muted);text-transform:uppercase}
.live{display:inline-flex;align-items:center;gap:6px;color:var(--win)}
.live i{width:7px;height:7px;border-radius:50%;background:var(--win);box-shadow:0 0 8px var(--win)}
.mu-t{display:grid;grid-template-columns:minmax(0,1fr) 64px 64px;gap:6px;align-items:center;padding:8px 12px}
.mu-t+.mu-t{border-top:1px dashed var(--line)}
.ob{border:1px solid var(--line-2);background:var(--ground-2);border-radius:7px;min-height:46px;display:grid;place-items:center;align-content:center;gap:1px;font:600 14px var(--mono);font-variant-numeric:tabular-nums;color:var(--ink)}
.ob small{font:500 9.5px var(--mono);color:var(--faint)}
.ob.fav{color:var(--cyan)}
.ob.sel{background:var(--gold);border-color:var(--gold);color:var(--gold-ink)}
.ob.sel small{color:#5a4705}
.ob[disabled]{opacity:.35}
.mu-tot{display:grid;grid-template-columns:minmax(0,1fr) 64px 64px;gap:6px;align-items:center;padding:8px 12px 10px;border-top:1px solid var(--line);background:rgba(13,10,21,.4)}
.mu-tot span{font:500 11.5px var(--mono);color:var(--muted);letter-spacing:.04em}
.colh{display:grid;grid-template-columns:minmax(0,1fr) 64px 64px;gap:6px;padding:0 12px;font:500 9.5px var(--mono);letter-spacing:.12em;color:var(--faint);text-transform:uppercase}
.colh span{text-align:center}

.res{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 10px;padding:9px 0;border-top:1px solid var(--line);align-items:center}
.res:first-child{border-top:0;padding-top:2px}
.res .s{font:700 16px var(--display);font-variant-numeric:tabular-nums;text-align:right;color:var(--win)}
.res .lose .tx>b{color:var(--faint);font-weight:500}
.res .lose+.s{color:var(--faint)!important}

/* tables */
.tw{overflow-x:auto;margin-inline:-14px;padding-inline:14px}
table{width:100%;border-collapse:collapse;font-size:13px}
th{font:500 9.5px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--faint);text-align:right;padding:6px 6px;border-bottom:1px solid var(--line-2);white-space:nowrap}
td{padding:9px 6px;border-bottom:1px solid var(--line);text-align:right;font-family:var(--mono);font-size:12.5px;font-variant-numeric:tabular-nums;white-space:nowrap;color:var(--ink)}
th:first-child,td:first-child{text-align:left;padding-left:0;font-family:var(--body)}
td.tm{max-width:150px;overflow:hidden;text-overflow:ellipsis}
tr.me td{background:rgba(246,207,76,.08)}
tr.cut td{border-bottom:1px dashed var(--pink)}
.pos{color:var(--win)}.negv{color:var(--loss)}

.pbar{height:5px;border-radius:3px;background:var(--line);overflow:hidden;margin-top:6px}
.pbar i{display:block;height:100%;background:var(--rule)}
.mv{font:600 11px var(--mono);min-width:30px;text-align:right}
.mv.up{color:var(--win)}.mv.dn{color:var(--loss)}.mv.eq{color:var(--faint)}

/* history */
.season{border:1px solid var(--line);border-radius:12px;background:var(--panel);overflow:hidden}
.season-h{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;background:linear-gradient(120deg,#2a2140,#160f24);position:relative}
.season-h::after{content:"";position:absolute;left:0;right:0;bottom:0;height:2px;background:var(--rule)}
.season-h b{font:700 28px var(--display);letter-spacing:.02em;color:var(--ink)}
.season-h span{font:500 10px var(--mono);letter-spacing:.16em;color:var(--cyan)}
.podium{display:grid;padding:4px 14px}
.pod{display:grid;grid-template-columns:30px minmax(0,1fr) auto;gap:8px;align-items:center;padding:9px 0;border-top:1px solid var(--line)}
.pod:first-child{border-top:0}
.medal{width:28px;height:28px;border-radius:7px;display:grid;place-items:center;font-size:14px;border:1px solid var(--line-2)}
.m-1{background:rgba(246,207,76,.18);border-color:var(--gold)}.m-2{background:rgba(76,236,255,.08)}.m-3{background:rgba(255,95,214,.08)}.m-s{background:rgba(255,84,112,.12);border-color:var(--loss)}
.lbl{font:500 10px var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);text-align:right}
.lbl.r{color:var(--loss)}
.season-f{display:flex;gap:8px;flex-wrap:wrap;padding:10px 14px 12px;border-top:1px solid var(--line);background:var(--ground-2)}
.pill{font:12px var(--mono);padding:5px 9px;border-radius:6px;border:1px solid var(--line-2);color:var(--muted)}
.pill b{color:var(--ink);font-family:var(--body);font-weight:600}

/* records */
.rec-hero{display:grid;gap:4px}
.rec-hero .big{font:700 56px var(--display);letter-spacing:.01em;line-height:1;color:var(--gold);font-variant-numeric:tabular-nums;text-shadow:0 0 24px rgba(246,207,76,.25)}
.rec-hero .holder{display:flex;align-items:center;gap:9px;margin-top:10px}
.rec-hero .holder .tx>b{color:var(--ink);font-size:15px}
.rec-hero .holder .tx>span{color:var(--muted);font-size:12px;display:block}
.who .new,.new{display:inline-block;font:500 9px var(--mono);letter-spacing:.1em;color:var(--ground-2);background:var(--pink);padding:2px 6px;border-radius:3px;margin-left:6px;vertical-align:2px}

/* rivalry */
.vs{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:8px;align-items:center;text-align:center}
.vs .side{display:grid;justify-items:center;gap:6px;min-width:0}
.vs .side b{font-size:13px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.vs .side strong{font:700 44px var(--display);font-variant-numeric:tabular-nums;line-height:1}
.vs .mid{font:500 11px var(--mono);color:var(--pink);letter-spacing:.14em}
select{font:inherit;font-size:14px;width:100%;min-height:44px;border:1px solid var(--line-2);border-radius:8px;background:var(--ground-2);color:var(--ink);padding:0 10px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.stat3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.stat{padding:10px;border:1px solid var(--line);border-radius:9px;background:var(--ground-2);text-align:center;min-width:0}
.stat small{display:block;font:500 9.5px var(--mono);letter-spacing:.1em;color:var(--muted);text-transform:uppercase}
.stat strong{display:block;font:700 22px var(--display);margin-top:3px;font-variant-numeric:tabular-nums}
.stat span{display:block;font:11px var(--mono);color:var(--faint);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* book */
.bk-hero .bank{font:700 48px var(--display);color:var(--gold);line-height:1;margin-top:8px;font-variant-numeric:tabular-nums;text-shadow:0 0 24px rgba(246,207,76,.25)}
.bet{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 10px;padding:11px 0;border-top:1px solid var(--line);align-items:center}
.bet:first-child{border-top:0;padding-top:2px}
.bet b{font-size:14px}
.bet span{font:12px var(--mono);color:var(--muted)}
.st{font:500 10px var(--mono);letter-spacing:.1em;padding:3px 7px;border-radius:4px;text-transform:uppercase;border:1px solid currentColor}
.st.pending{color:var(--cyan)}
.x{border:1px solid var(--line-2);background:transparent;border-radius:5px;font:500 10.5px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:6px 9px;min-height:32px}

/* sheet */
.scrim{position:fixed;inset:0;z-index:60;background:rgba(5,3,10,.62);opacity:0;pointer-events:none;transition:opacity .2s}
.scrim.open{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:61;max-height:88vh;overflow-y:auto;background:var(--ground);border-top:1px solid var(--line-2);border-radius:18px 18px 0 0;padding:8px 12px calc(env(safe-area-inset-bottom,0px) + 18px);transform:translateY(105%);visibility:hidden;transition:transform .26s cubic-bezier(.2,.8,.2,1),visibility 0s .26s;box-shadow:0 -10px 40px rgba(0,0,0,.5);max-width:720px;margin:0 auto}
.sheet.open{transform:none;visibility:visible;transition:transform .26s cubic-bezier(.2,.8,.2,1)}
.grab{width:40px;height:4px;border-radius:4px;background:var(--rule);margin:2px auto 12px}
.sheet-body{display:grid;gap:12px}
.stake{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center}
.stake input{font:700 26px var(--display);width:100%;min-height:54px;border:1px solid var(--line-2);border-radius:10px;padding:0 14px;background:var(--ground-2);color:var(--gold);font-variant-numeric:tabular-nums}
.quick{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.quick button{min-height:42px;border:1px solid var(--line-2);background:var(--panel);border-radius:7px;font:600 13px var(--mono)}
.cta{width:100%;min-height:54px;border:0;border-radius:10px;background:var(--gold);color:var(--gold-ink);font:700 18px var(--display);letter-spacing:.04em;text-transform:uppercase;box-shadow:0 0 22px rgba(246,207,76,.25)}
.cta[disabled]{opacity:.4;box-shadow:none}
.ghost{width:100%;min-height:44px;border:1px solid var(--line-2);border-radius:10px;background:transparent;font:500 12px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.towin{display:flex;justify-content:space-between;align-items:baseline;font:12px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.towin b{color:var(--win);font:700 22px var(--display)}
.err{color:var(--loss);font-size:12.5px}

.trophies{display:flex;gap:6px;flex-wrap:wrap}
.tr{display:inline-flex;align-items:center;gap:5px;font:500 11px var(--mono);letter-spacing:.06em;padding:4px 8px;border-radius:4px;border:1px solid currentColor;text-transform:uppercase}
.tr.c{color:var(--gold)}.tr.r{color:var(--muted)}.tr.s{color:var(--loss)}.tr.p{color:var(--cyan)}
.toast{position:fixed;left:50%;bottom:calc(var(--tab-h) + env(safe-area-inset-bottom,0px) + 14px);transform:translate(-50%,20px);z-index:70;background:var(--panel-3);border:1px solid var(--gold);color:var(--ink);font:500 13px var(--mono);padding:11px 16px;border-radius:8px;opacity:0;transition:.22s;pointer-events:none;box-shadow:0 8px 24px rgba(0,0,0,.4);max-width:calc(100% - 32px)}
.toast.show{opacity:1;transform:translate(-50%,0)}
.foot{text-align:center;font:11px var(--mono);letter-spacing:.06em;color:var(--faint);padding:6px 0 2px}
.dots{display:inline-flex;gap:5px;vertical-align:middle;margin-right:6px}
.dots i{width:8px;height:8px;border-radius:50%;display:block}
@media (min-width:600px){.hero{padding:22px 22px 18px}.hero h1{font-size:44px}.tiles{grid-template-columns:repeat(4,minmax(0,1fr))}}
@media (prefers-reduced-motion:reduce){.sheet,.scrim,.toast{transition:none}}
/* game detail + tappable rows */
button.row,button.res{width:100%;border:0;border-top:1px solid var(--line);background:none;text-align:left;color:inherit;font:inherit}
button.row:first-child,button.res:first-child{border-top:0}
button.row:active,button.res:active{background:rgba(246,207,76,.07)}
.chev{color:var(--pink);font:600 20px var(--mono);line-height:1;text-align:right}
.sb{display:grid;gap:8px;margin-top:12px}
.sb-row{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:rgba(13,10,21,.55)}
.sb-pts{font:700 32px var(--display);color:var(--faint)}

.pinbox{display:grid;justify-items:center;gap:8px;text-align:center;padding-top:6px}

@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.pad{display:grid;grid-template-columns:repeat(3,76px);gap:10px;justify-content:center;margin-top:4px}

.pk2:active{background:var(--panel-3)}

.fld input{min-height:46px;border:1px solid var(--line-2);border-radius:9px;background:var(--ground-2);color:var(--ink);padding:0 12px;font-family:inherit;font-size:16px;width:100%}
.chk{display:flex;gap:8px;align-items:center;font-size:13px;color:var(--muted)}

<script>
(function(){
var D=JSON.parse(document.getElementById('data').textContent);
var $=function(s){return document.querySelector(s)};
var view=$('#view');
var PAL=['#f6cf4c','#4cecff','#ff5fd6','#5dff8f','#ffb347','#b18cff','#7ef0d4','#ff8a65','#8fb3ff','#ffd6f2','#c6ff6b','#ff9fb2','#9aa3c7','#f2a7ff'];
var ids=Object.keys(D.managers);
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function M(u){return D.managers[u]||{name:'?',team:'?'}}
function team(u){return (M(u).team||M(u).name).trim()}
function initials(u){var n=M(u).name;var p=n.replace(/[^A-Za-z0-9 ]/g,'').match(/[A-Z][a-z]*|[a-z]+|\d+/g)||[n];return ((p[0]||'')[0]+((p[1]||'')[0]||(p[0]||'')[1]||'')).toUpperCase()}
function color(u){return PAL[ids.indexOf(u)%PAL.length]}
function av(u,sz){sz=sz||32;var a=LIVE&&D.avatars&&D.avatars[u];return '<span class="av" style="width:'+sz+'px;height:'+sz+'px;font-size:'+Math.round(sz*.38)+'px;background:'+color(u)+'">'+esc(initials(u))+(a?'<img src="https://sleepercdn.com/avatars/thumbs/'+a+'" alt="" loading="lazy" onerror="this.remove()">':'')+'</span>'}
function teamF(u){return team(u)+(M(u).active?'':' (former)')}
function fmr(u){return M(u).active?'':'<span class="fmr">Former</span>'}
function who(u,sub,sz){return '<button class="who" type="button" data-mgr="'+u+'">'+av(u,sz)+'<span class="tx"><b>'+esc(team(u))+fmr(u)+'</b><span>'+esc(sub!=null?sub:M(u).name)+'</span></span></button>'}
function whoS(u,sub,sz){return '<span class="who">'+av(u,sz)+'<span class="tx"><b>'+esc(team(u))+fmr(u)+'</b><span>'+esc(sub!=null?sub:M(u).name)+'</span></span></span>'}
function gi(s,w,u){for(var i=0;i<D.games.length;i++){var g=D.games[i];if(g.s===s&&g.w===w&&(g.win===u||g.lose===u))return i}return -1}
function CUR(){return D.league.season}
function ALLS(){return Object.keys(D.seasons).sort().reverse()}
function PAST(){return ALLS().filter(function(s){return s!==CUR()&&D.seasons[s].champ})}
function DONE(){var o=[];for(var w=1;w<=D.league.last_scored;w++)o.push(w);return o}
var CHEV='<span class="chev" aria-hidden="true">›</span>';
function f2(n){return Number(n).toFixed(2)}
function f1(n){return Number(n).toFixed(1)}
function odds(o){return o>0?'+'+o:String(o)}
function spr(x){return x===0?'PK':(x>0?'+'+f1(x):f1(x))}
function money(n){return Math.round(n).toLocaleString('en-US')}
function sw(s,w){return s+' · Wk '+w}
function store(k,v){try{if(v===undefined)return JSON.parse(localStorage.getItem('mh-'+k));localStorage.setItem('mh-'+k,JSON.stringify(v))}catch(e){return null}}

var S={tab:'home',lseg:'season',rec:'high',rf:'all',resMore:false,recMore:false,hw:D.league.last_scored,aws:D.league.season,lab:'bench',labs:D.league.season,sw:null,ss:null,h2a:null,h2b:null,me:(store('auth')||{}).user_id||store('me')||D.me,bseg:'lines',picks:[],stake:25,lt:null,pin:'',pin1:null,pinErr:'',pinBusy:false};
S.h2a=S.me;
/* On Railway the page sits next to our server: turn on live lineups + real avatars. */
var LIVE=false;
try{fetch('/api/health',{headers:{accept:'application/json'}}).then(function(r){return r.ok?r.json():null}).then(function(j){if(j&&j.ok&&j.app==="Mahomie's Hub"){LIVE=true;render();loadHub();bookLoad()}}).catch(function(){})}catch(e){}

function loadHub(){
  fetch('/api/hub',{headers:{accept:'application/json'}}).then(function(r){return r.ok?r.json():null}).then(function(j){
    if(!j||!j.league||!j.seasons)return;
    D=j;ids=Object.keys(D.managers);
    S.hw=D.league.last_scored||1;S.aws=CUR();S.labs=CUR();S.h2b=null;
    render();
  }).catch(function(){});
}
setInterval(function(){if(LIVE&&document.visibilityState==='visible'&&!$('#sheet').classList.contains('open'))loadHub()},3*60*1000);
/* ---------- Book math ---------- */
function line(id){return D.lines.find(function(l){return l.id===id})}
/* ---------- HOME ---------- */
function weekGames(s,w){return D.games.map(function(g,i){return {g:g,i:i}}).filter(function(x){return x.g.s===s&&x.g.w===w})}
function home(){
  var L=D.league,hw=S.hw,me=S.me;
  var my=D.lines.filter(function(l){return l.a===me||l.b===me})[0];
  var h='<section class="hero hero-tight"><div class="eyebrow">'+CUR()+' · Week '+L.week+(LIVE?' · <span class="live"><i></i>Live</span>':'')+'</div><h1>Week '+L.week+'</h1>';
  if(my){
    var mineA=my.a===me,opp=mineA?my.b:my.a,myPts=mineA?my.live_a:my.live_b,opPts=mineA?my.live_b:my.live_a,wp=Math.round((mineA?my.wp:1-my.wp)*100);
    h+='<button type="button" class="yourgame" data-prev="'+my.id+'"><div class="yg-k">Your game · tap for preview</div>'+
     '<div class="yg-row">'+av(me,40)+'<div class="yg-n"><b>'+esc(team(me))+'</b><span>'+wp+'% to win</span></div><b class="yg-s num">'+f2(myPts)+'</b></div>'+
     '<div class="yg-row">'+av(opp,40)+'<div class="yg-n"><b>'+esc(team(opp))+'</b><span>'+(100-wp)+'% to win</span></div><b class="yg-s num dim">'+f2(opPts)+'</b></div>'+
     '<div class="wp-bar"><i style="width:'+wp+'%"></i></div></button>';
  } else {
    var o=(D.odds.list||[]).find(function(x){return x.uid===me});var st=(D.seasons[CUR()].standings||[]).find(function(x){return x.uid===me});
    if(st)h+='<button type="button" class="yourgame" data-go="league:odds"><div class="yg-k">Your season</div><div class="yg-row">'+av(me,40)+'<div class="yg-n"><b>'+esc(team(me))+'</b><span>'+st.w+'-'+st.l+' · seed '+st.seed+(o?' · '+pct(o.playoff)+' playoff odds':'')+'</span></div></div></button>';
  }
  h+='</section>';
  if(D.lines.length){
    h+='<section class="panel tight"><div class="ph"><div><div class="kicker">Live scores · tap a game</div><h2>This week</h2></div><button class="link" data-go="book">Bet →</button></div><div class="games">'+
     D.lines.map(function(l){var aw=l.live_a>=l.live_b;return '<button type="button" class="gl" data-prev="'+l.id+'">'+
       '<span class="gl-t'+(aw&&l.live_a>0?' w':'')+'">'+av(l.a,22)+'<b>'+esc(team(l.a))+'</b><i class="num">'+f1(l.live_a)+'</i></span>'+
       '<span class="gl-t'+(!aw&&l.live_b>0?' w':'')+'">'+av(l.b,22)+'<b>'+esc(team(l.b))+'</b><i class="num">'+f1(l.live_b)+'</i></span></button>'}).join('')+'</div></section>';
  }
  var wk=weekScores(CUR(),hw),top=wk[0],rot=wk[wk.length-1],potw=null;
  wk.forEach(function(x){var t=topP(CUR(),hw,x.u);if(t&&t.name&&(!potw||t.pts>potw.pts))potw={u:x.u,name:t.name,pts:t.pts}});
  if(top){
    h+='<section class="panel tight"><div class="ph"><div><div class="kicker">Week '+hw+' final</div><h2>Last week</h2></div><button class="link" data-wk="'+hw+'">Recap &amp; scores →</button></div><div class="lw">'+
     '<button type="button" class="lw-c t-y" data-game="'+gi(CUR(),hw,top.u)+'"><small>🔥 High score</small><strong class="num">'+f1(top.p)+'</strong><span>'+esc(team(top.u))+'</span></button>'+
     '<button type="button" class="lw-c t-r" data-game="'+gi(CUR(),hw,rot.u)+'"><small>🧊 Low score</small><strong class="num">'+f1(rot.p)+'</strong><span>'+esc(team(rot.u))+'</span></button>'+
     (potw?'<button type="button" class="lw-c t-b" data-game="'+gi(CUR(),hw,potw.u)+'"><small>⭐ Top player</small><strong class="num">'+f1(potw.pts)+'</strong><span>'+esc(potw.name)+'</span></button>':'')+
     '</div></section>';
  }
  h+='<section class="block"><div class="bh"><div><div class="kicker">Everything else</div><h2>Explore</h2></div></div><div class="jump">'+
   [['data-go="league:awards"','🏆','Awards','t-y'],['data-go="league:odds"','🎯','Playoff odds','t-b'],['data-go="league:season"','📈','Power rankings','t-g'],
    ['data-go="records"','📚','Record book','t-r'],['data-go="league:history"','📜','History','t-k'],['data-go="league:h2h"','⚔️','Rivals','t-g'],
    ['data-wk="'+hw+'"','📅','Weekly results','t-b'],['data-twih="1"','🕰️','This week in history','t-y'],['data-go="league:lab"','🧪','Lab','t-r']]
    .map(function(j){return '<button type="button" class="jt '+j[3]+'" '+j[0]+'><span>'+j[1]+'</span><b>'+j[2]+'</b></button>'}).join('')+'</div></section>';
  return h+foot();
}
function weekSheet(s,w){
  var last=s===CUR()?D.league.last_scored:((D.seasons[s]||{}).last||17);
  var h='<section class="hero"><div class="eyebrow">'+s+' · results</div><h1>Week '+w+'</h1></section>';
  h+='<div class="chips wrap">';for(var i=1;i<=last;i++)h+='<button type="button" class="chip'+(i===w?' on':'')+'" data-wk="'+i+'" data-wks="'+s+'">'+(i>=15?'P'+(i-14):'Wk '+i)+'</button>';h+='</div>';
  return h+'<section class="panel">'+recapHtml(s,w)+resultsHtml(s,w)+'</section>';
}
function twihSheet(){return '<section class="hero"><div class="eyebrow">Week '+D.league.week+' in past seasons</div><h1>This week in history</h1></section>'+historyCard(D.league.week)}
function matchCard(l,i){
  var fa=l.spread>=0,fav=fa?l.a:l.b,sp=Math.abs(l.spread);
  var side=function(u,pts,ml){return '<div class="mc-t">'+av(u,34)+'<span class="mc-n"><b>'+esc(team(u))+'</b><small>ML '+odds(ml)+'</small></span><span class="mc-s num">'+f2(pts)+'</span></div>'};
  return '<button type="button" class="mcard" data-prev="'+l.id+'"><div class="mc-h"><span>Game '+(i+1)+'</span><span class="live"><i></i>Live</span></div>'+
   side(l.a,l.live_a,l.ml_a)+side(l.b,l.live_b,l.ml_b)+
   '<div class="mc-f"><span>'+esc(team(fav).split(' ').slice(0,2).join(' '))+' by '+f1(sp)+'</span><span>O/U '+f1(l.total)+'</span><span class="mc-go">Preview ›</span></div></button>'}
function awardCard(a){var gx=a.game?gi(a.game.s,a.game.w,a.game.win):-1;
  return '<button type="button" class="acard a-'+a.key+'" '+(gx>=0?'data-game="'+gx+'"':'data-mgr="'+a.uid+'"')+'><span class="aw-ic">'+(AW_ICON[a.key]||'⭐')+'</span><span class="aw-t">'+esc(a.title)+'</span><span class="aw-v num">'+esc(a.val)+'</span><span class="aw-w">'+av(a.uid,20)+'<b>'+esc(team(a.uid))+'</b></span></button>'}
function oddsBar(p){var pc=Math.round(p*1000)/10;return '<div class="ob2"><div class="ob2-t"><i style="width:'+Math.max(2,pc)+'%"></i></div><b>'+(pc>=99.95?'>99.9':pc<0.05?'<0.1':pc.toFixed(1))+'%</b></div>'}
function resultsHtml(s,w,lim){var gs=weekGames(s,w).slice(0,lim||99);if(!gs.length)return '<p class="muted">No games found for this week.</p>';
  return '<div>'+gs.map(function(x){var g=x.g;return '<button type="button" class="res" data-game="'+x.i+'"><div>'+whoS(g.win,tnS(s,g.win)===team(g.win)?M(g.win).name:'as '+tnS(s,g.win),26)+'</div><span class="s">'+f2(g.wp)+'</span><div class="lose">'+whoS(g.lose,tnS(s,g.lose)===team(g.lose)?M(g.lose).name:'as '+tnS(s,g.lose),26)+'</div><span class="s" style="color:var(--faint)">'+f2(g.lp)+'</span></button>'}).join('')+'</div>'}
function enteringPct(s,w,u){var a=0,b=0;D.games.forEach(function(x){if(x.s!==s||x.w>=w||x.k!=='Regular season')return;if(x.win===u)a++;else if(x.lose===u)b++});return a+b?a/(a+b):.5}
function recapHtml(s,w){
  var gs=weekGames(s,w).map(function(x){return x.g});if(!gs.length)return '';
  var ws=weekScores(s,w),top=ws[0],low=ws[ws.length-1];
  var blow=gs.slice().sort(function(a,b){return b.m-a.m})[0],close=gs.slice().sort(function(a,b){return a.m-b.m})[0];
  var ups=gs.filter(function(g){return w>1&&enteringPct(s,w,g.lose)-enteringPct(s,w,g.win)>=.3}).sort(function(a,b){return (enteringPct(s,w,b.lose)-enteringPct(s,w,b.win))-(enteringPct(s,w,a.lose)-enteringPct(s,w,a.win))})[0];
  var broke=[];gs.forEach(function(g){gameRecs(g).forEach(function(r){if(r.n<=5)broke.push('#'+r.n+' all-time '+RN[r.k].toLowerCase()+' ('+esc(tnS(s,g.win))+' vs '+esc(tnS(s,g.lose))+')')})});
  var t='<b>'+esc(tnS(s,top.u))+'</b> led the week with '+f2(top.p)+', while <b>'+esc(tnS(s,low.u))+'</b> brought up the rear at '+f2(low.p)+'. ';
  t+='<b>'+esc(tnS(s,blow.win))+'</b> ran away from '+esc(tnS(s,blow.lose))+' by '+f1(blow.m)+'. ';
  t+='The nail-biter: '+esc(tnS(s,close.win))+' edged '+esc(tnS(s,close.lose))+' by '+f2(close.m)+'. ';
  if(ups)t+='Upset alert: <b>'+esc(tnS(s,ups.win))+'</b> knocked off '+esc(tnS(s,ups.lose))+'. ';
  if(broke.length)t+='Record book: '+broke.slice(0,2).join('; ')+'.';
  return '<div class="recap"><div class="kicker" style="color:var(--pink)">Week '+w+' recap</div><p>'+t+'</p></div>'}
function historyCard(w){
  var items=[];PAST().forEach(function(s){var gs=weekGames(s,w);if(!gs.length)return;
    var ws=weekScores(s,w),hi=ws[0],b=gs.slice().sort(function(a,c){return c.g.m-a.g.m})[0];
    items.push('<button type="button" class="row" data-game="'+gi(s,w,hi.u)+'" style="grid-template-columns:52px minmax(0,1fr) auto 10px"><span class="yr">'+s+'</span><div style="min-width:0"><b style="font-size:13.5px;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+esc(tnS(s,hi.u))+' dropped '+f2(hi.p)+'</b><span class="muted" style="font-size:11.5px">Biggest win: '+esc(tnS(s,b.g.win))+' by '+f1(b.g.m)+'</span></div><span></span>'+CHEV+'</button>')});
  return '<section class="panel"><div class="ph"><div><div class="kicker">Week '+w+' in past seasons</div><h2>This week in history</h2></div></div><div class="rows">'+items.join('')+'</div></section>'}
function tile(c,k,v,s,u,gix){return '<button class="tile '+c+'" type="button" '+(gix!=null&&gix>=0?'data-game="'+gix+'"':'data-mgr="'+u+'"')+'><small>'+esc(k)+'</small><strong class="num">'+esc(v)+'</strong><span>'+esc(s)+'</span></button>'}
function mv(m){return '<span class="mv '+(m>0?'up':m<0?'dn':'eq')+'">'+(m>0?'▲'+m:m<0?'▼'+(-m):'–')+'</span>'}
function foot(){return '<p class="foot"><span class="dots"><i style="background:var(--gold)"></i><i style="background:var(--pink)"></i><i style="background:var(--cyan)"></i><i style="background:var(--win)"></i></span>v'+D.version+' · Sleeper data as of '+esc(D.updated_label)+'</p>'}

/* ---------- LEAGUE ---------- */
var LSEGS=[['season','📊','Standings'],['odds','🎯','Playoff odds'],['awards','🏆','Awards'],['history','📜','History'],['alltime','👑','All-time'],['h2h','⚔️','Rivals'],['lab','🧪','Lab'],['@records','📚','Records']];
function league(){
  var h='<div class="lnav">'+LSEGS.map(function(x){var go=x[0][0]==='@';return '<button type="button" class="ln-t'+(S.lseg===x[0]?' on':'')+'" '+(go?'data-go="'+x[0].slice(1)+'"':'data-lseg="'+x[0]+'"')+'><span>'+x[1]+'</span><b>'+x[2]+'</b></button>'}).join('')+'</div>';
  h+=({season:seasonView,odds:oddsView,history:historyView,alltime:alltimeView,h2h:h2hView,awards:awardsView,lab:labView}[S.lseg]||seasonView)();
  return h+foot();
}
function seasonView(){
  var st=D.seasons[CUR()].standings;

var RECS=[
 ['high','Highest score','team'],['low','Lowest score','team'],['blowout','Biggest blowout','game'],['close','Closest game','game'],
 ['hiloss','Most points in a loss','game'],['lowin','Fewest points in a win','game'],['player','Best player game','player'],
 ['seasonhi','Most points · season','season'],['seasonlo','Fewest points · season','season'],['wstreak','Longest win streak','streak'],['lstreak','Longest losing streak','streak']];
function recType(k){return RECS.find(function(r){return r[0]===k})[2]}
function recList(k){var t=recType(k);if(t==='season'||t==='streak'||S.rf==='all')return D.records[k];return D.recf[S.rf][k]}
function recVal(k,x){var t=recType(k);
  if(t==='team')return {u:x.uid,v:f2(x.v),sub:sw(x.s,x.w)};
  if(t==='player')return {u:x.uid,v:f1(x.v),sub:(x.name?x.name+(x.pos?' ('+x.pos+')':''):'Top scorer')+' · '+sw(x.s,x.w)};
  if(t==='season')return {u:x.uid,v:f1(x.v),sub:x.s+' · '+x.rec};
  if(t==='streak')return {u:x.uid,v:x.n+(x.t==='W'?' W':' L'),sub:x.start+' → '+x.end+(x.live?' · active':'')};
  var g=x;var u=(k==='hiloss')?g.lose:g.win;
  var v=k==='blowout'||k==='close'?f2(g.m):k==='hiloss'?f2(g.lp):f2(g.wp);
  return {u:u,v:v,sub:(k==='hiloss'?'lost to ':'beat ')+teamF(k==='hiloss'?g.win:g.lose)+' '+f2(g.wp)+'–'+f2(g.lp)+' · '+sw(g.s,g.w)+(g.k!=='Regular season'?' · '+g.k:'')};
}
function byeKey(k,x){var t=recType(k);if((t==='team'||t==='player')&&D.tw[x.s+'|'+x.w+'|'+x.uid])return x.s+'|'+x.w+'|'+x.uid;return null}
function recGame(k,x){var t=recType(k);
  if(t==='team'||t==='player')return gi(x.s,x.w,x.uid);
  if(t==='game')return gi(x.s,x.w,x.win);return -1}

function recPickSheet(){
  var groups=[['Team scores',['high','low','seasonhi','seasonlo']],['Games',['blowout','close','hiloss','lowin']],['Players & streaks',['player','wstreak','lstreak']]];
  return '<div class="ph" style="margin:0"><div><div class="kicker">Record book</div><h2>Pick a record</h2></div></div>'+groups.map(function(g){return '<div class="kicker" style="margin-top:4px">'+g[0]+'</div><div class="pick-grid">'+g[1].map(function(k){var r=RECS.find(function(x){return x[0]===k});return '<button type="button" class="pk'+(k===S.rec?' on':'')+'" data-rec="'+k+'">'+r[1]+'</button>'}).join('')+'</div>'}).join('');
}

/* ---------- SPORTSBOOK (live, v1.8): talks to /api/book ---------- */
var BK={on:null,status:null,wk:null,me:null,lb:null,feed:null,teams:null,err:null};
var AUTH=store('auth')||null;
function api(path,opt){opt=opt||{};var h={accept:'application/json'};if(opt.body)h['content-type']='application/json';if(AUTH&&AUTH.token)h.authorization='Bearer '+AUTH.token;
  return fetch('/api/book'+path,{method:opt.method||(opt.body?'POST':'GET'),headers:h,body:opt.body?JSON.stringify(opt.body):undefined,cache:'no-store'})
   .then(function(r){return r.json().catch(function(){return {}}).then(function(j){
     if(r.status===401&&AUTH&&path!=='/login'){AUTH=null;store('auth',null);BK.me=null}
     if(!r.ok)throw new Error(j.error||('Something went wrong ('+r.status+')'));return j})})}
var bookBusy=false;
var bookAt=0;
function bookLoad(){
  if(!LIVE||bookBusy)return Promise.resolve();bookBusy=true;bookAt=Date.now();
  return api('/status').then(function(s){BK.on=true;BK.status=s;BK.err=null;
    return Promise.all([api('/lines').then(function(w){BK.wk=w}),api('/leaderboard').then(function(x){BK.lb=x}),api('/feed?limit=40').then(function(x){BK.feed=x}),
      AUTH?api('/me').then(function(m){BK.me=m;if(S.me!==m.user_id){S.me=m.user_id;store('me',S.me);S.h2a=S.me}}).catch(function(){}):null])})
   .then(function(){S.picks=S.picks.filter(function(p){var l=bl(p.line);return l&&!isLk(l)&&!(p.mkt==='ml'&&legOdds(p)==null)});bookBusy=false;render()})
   .catch(function(e){bookBusy=false;BK.on=false;BK.err=e.message;render()})}
// Live games refresh every 30 s on the Book tab; otherwise once a minute.
setInterval(function(){if(document.visibilityState!=='visible'||(S.tab!=='book'&&S.tab!=='me'))return;var live=BK.wk&&BK.wk.lines&&BK.wk.lines.some(function(l){return l.live&&!l.finished});
  if(live||Date.now()-bookAt>55000)bookLoad()},30000);
document.addEventListener('visibilitychange',function(){if(document.visibilityState==='visible')bookLoad()});

function bl(id){return BK.wk&&BK.wk.lines?BK.wk.lines.find(function(l){return l.id===id}):null}
function BS(){return (BK.status&&BK.status.settings)||{min_bet:10,max_bet:250,parlay_max_legs:4,parlay_max_payout:10000,grant:1000}}
function a2d(o){return o>0?1+o/100:1+100/Math.abs(o)}
function legOdds(p){var l=bl(p.line);return p.mkt==='ml'?(p.side==='a'?l.ml_a:l.ml_b):p.mkt==='spread'?l.spread_price:l.total_price}
function legPoint(p){var l=bl(p.line);return p.mkt==='spread'?(p.side==='a'?-l.spread:l.spread):p.mkt==='total'?l.total:null}
function legLabel(p){var l=bl(p.line);if(p.mkt==='ml')return team(p.side==='a'?l.a:l.b)+' to win';if(p.mkt==='spread')return team(p.side==='a'?l.a:l.b)+' '+spr(legPoint(p));return (p.side==='over'?'Over ':'Under ')+f1(l.total)}
function slipDec(){return S.picks.reduce(function(x,p){return x*a2d(legOdds(p))},1)}
function slipOdds(){var d=slipDec();return S.picks.length===1?legOdds(S.picks[0]):(d>=2?Math.round((d-1)*100):-Math.round(100/(d-1)))}
function slipWin(st){var w=st*slipDec();if(S.picks.length>1)w=Math.min(w,BS().parlay_max_payout);return w-st}
function bank(){return BK.me?BK.me.balance:0}
function money2(n){return Number(n).toLocaleString('en-US',{maximumFractionDigits:2})}
function whenTxt(iso){return new Date(iso).toLocaleString('en-US',{weekday:'short',hour:'numeric',minute:'2-digit'})}
function lockTxt(l){if(l.status==='final')return 'Final';if(l.status==='void')return 'Off the board';if(l.finished)return 'Games over · waiting on final';
  if(l.live)return 'Live odds'+(l.left!=null?' · '+l.left+'% left to play':'');
  var ms=l.lock_at?new Date(l.lock_at)-Date.now():null;if(ms==null)return 'Pregame line';if(ms<=0)return 'Going live';
  if(ms<36e5)return 'Goes live in '+Math.max(1,Math.round(ms/6e4))+' min';if(ms<864e5)return 'Goes live in '+Math.floor(ms/36e5)+'h '+Math.round(ms%36e5/6e4)+'m';return 'Pregame · goes live '+whenTxt(l.lock_at)}
function isLk(l){return l.status!=='open'||!!l.finished}
function blocked(l,mkt,side){var me=AUTH&&AUTH.user_id;if(!me||(l.a!==me&&l.b!==me))return false;var mine=l.a===me?'a':'b';if(mkt==='total')return side==='under';return side!==mine}
function picked(id,mkt,side){return S.picks.some(function(p){return p.line===id&&p.mkt===mkt&&p.side===side})}
function obk(l,mkt,side,label,sub,fav){if(mkt==='ml'&&(side==='a'?l.ml_a:l.ml_b)==null){label='Off';fav=false}var lk=isLk(l)||(mkt==='ml'&&(side==='a'?l.ml_a:l.ml_b)==null),dis=lk||blocked(l,mkt,side);
  return '<button type="button" class="ob'+(fav?' fav':'')+(picked(l.id,mkt,side)?' sel':'')+'" data-bk="'+l.id+'|'+mkt+'|'+side+'"'+(dis?' disabled':'')+(blocked(l,mkt,side)?' title="You can\'t bet against yourself"':'')+'>'+esc(label)+(sub!=null?'<small>'+odds(sub)+'</small>':'')+'</button>'}
function sideRowB(l,s){var u=s==='a'?l.a:l.b,sp=s==='a'?-l.spread:l.spread,ml=s==='a'?l.ml_a:l.ml_b,sc=s==='a'?l.score_a:l.score_b;
  return '<div class="mu-t">'+who(u,(sc!=null&&(l.live||l.status!=='open')?f2(sc)+' pts · ':'')+'proj '+f1(s==='a'?l.proj_a:l.proj_b)+(function(o){return o&&o.length?' · '+o.length+' slot'+(o.length>1?'s':'')+' not playing':''})(s==='a'?l.out_a:l.out_b),30)+obk(l,'spread',s,spr(sp),l.spread_price,sp<0)+obk(l,'ml',s,odds(ml),null,sp<0)+'</div>'}
function bookHero(){
  if(AUTH&&BK.me){var open=BK.me.bets.filter(function(b){return b.status==='open'});
    return '<section class="hero bk-hero"><div class="eyebrow">Mahomie\'s Sportsbook · '+esc(team(BK.me.user_id))+'</div><div class="bank">💵 '+money2(BK.me.balance)+'</div><p class="sub" style="margin-top:6px">Mahomie Bucks to bet · '+open.length+' open bet'+(open.length===1?'':'s')+(open.length?' ('+money2(BK.me.in_play)+' in play)':'')+'</p></section>'}
  return '<section class="hero bk-hero"><div class="eyebrow">Mahomie\'s Sportsbook</div><h1 style="margin-top:6px">Bet with Mahomie Bucks</h1><p class="sub">Every manager gets '+money(BS().grant)+' Bucks for the season. No refills.</p>'+
   (BK.on?'<button type="button" class="cta" data-login="1" style="margin-top:12px">Log in to bet</button>':'')+'</section>'}
function bookOff(){return '<section class="panel"><div class="ph"><div><div class="kicker">Sportsbook</div><h2>'+(LIVE?'The Book is offline':'Open the live app')+'</h2></div></div><p class="muted" style="font-size:13px;line-height:1.5">'+
  (LIVE?esc(BK.err||'The Book couldn\'t load.')+' Try again in a minute.':'Betting only works in the live app on Railway.')+'</p>'+(LIVE?'<button type="button" class="ghost" data-bkreload="1" style="margin-top:10px">Try again</button>':'')+'</section>'}
function betCard(b,mine){var lk=b.legs.some(function(g){return g.started||g.locked});
  var st=b.status==='open'?(lk?'<span class="st pending">Live</span>':'<span class="st pending">Open</span>'):'<span class="st s-'+b.status+'">'+b.status+'</span>';
  return '<div class="bet"><div>'+(mine?'':'<b style="font-size:12.5px;color:var(--gold)">'+esc(team(b.user_id))+'</b>')+
   b.legs.map(function(g){return '<b style="display:block">'+(b.legs.length>1?'<i class="lg lg-'+g.result+'"></i>':'')+esc(g.label)+(g.live?' <span class="tr p" style="font-size:9px;padding:1px 4px">LIVE</span>':'')+'</b>'}).join('')+
   '<span style="display:block">'+(b.kind==='parlay'?b.legs.length+'-pick parlay · ':'')+odds(b.odds)+' · '+money2(b.stake)+(b.status==='won'?' → won '+money2(b.payout-b.stake):b.status==='lost'?' · lost':b.status==='push'||b.status==='void'?' · stake back':' to win '+money2(b.to_win))+' · Wk '+b.week+'</span></div>'+
   '<div style="display:flex;gap:6px;align-items:center;flex-wrap:wrap;justify-content:flex-end">'+st+(mine&&b.status==='open'&&!lk?'<button class="x" type="button" data-bcancel="'+b.id+'">Cancel</button>':'')+'</div></div>'}
function book(){
  var h=bookHero();
  h+='<div class="seg">'+[['lines','Lines'],['mine','My bets'],['leaders','Leaders'],['how','Rules']].map(function(x){return '<button type="button" class="'+(S.bseg===x[0]?'on':'')+'" data-bseg="'+x[0]+'">'+x[1]+'</button>'}).join('')+'</div>';
  if(S.bseg!=='how'&&!BK.on)return h+(BK.on===null&&LIVE?'<p class="muted" style="padding:16px 4px">Loading the Book…</p>':bookOff())+foot();
  if(S.bseg==='lines'){
    var W=BK.wk;
    if(!W||!W.week||!W.lines.length){var nx=BK.status&&BK.status.next;
      h+='<section class="panel"><div class="ph"><div><div class="kicker">Week '+(nx?nx.week:D.league.week)+'</div><h2>Lines aren\'t up yet</h2></div></div><p class="muted" style="font-size:13px;line-height:1.5">'+(nx&&nx.posts_label?'They post <b style="color:var(--gold)">'+esc(nx.posts_label)+'</b> (Pacific) and stay frozen all week.':'They post Tuesday at 6 AM Pacific.')+' Each game locks when the first starter in either lineup kicks off.</p></section>';
    } else {
      var settled=!!W.settled_at;
      h+='<div class="bk-sub"><span>Week '+W.week+(settled?' · settled':W.settle_at?' · settles '+whenTxt(W.settle_at):'')+'</span><span>Spread · Money</span></div>';
      h+=W.lines.map(function(l,i){var sc=l.score_a!=null&&(l.score_a||l.score_b)?'<span class="num">'+f2(l.score_a)+' – '+f2(l.score_b)+'</span>':'';
        var on=l.live&&!l.finished&&l.status==='open';return '<div class="mu'+(l.status==='void'?' void':'')+'"><div class="mu-h"><span class="'+(on?'live':'')+'">'+(on?'<i></i>':'')+esc(lockTxt(l))+'</span>'+(sc||(line('w'+W.week+'m'+l.matchup_id)?'<button type="button" class="prev-link" data-prev="w'+W.week+'m'+l.matchup_id+'">Preview ›</button>':''))+'</div>'+
         sideRowB(l,'a')+sideRowB(l,'b')+
         '<div class="mu-tot"><span>Total '+f1(l.total)+'</span>'+obk(l,'total','over','O '+f1(l.total),l.total_price)+obk(l,'total','under','U '+f1(l.total),l.total_price)+'</div>'+
         (l.live&&l.open?'<p class="mu-note">Opened: '+esc(team(l.a))+' '+spr(-l.open.spread)+' · total '+f1(l.open.total)+'</p>':'')+
         (l.note?'<p class="mu-note">'+esc(l.note)+'</p>':'')+'</div>'}).join('');
      if(!AUTH)h+='<p class="note"><b>Look around all you want.</b> Log in with your team and PIN to place bets.</p>';
    }
  }
  if(S.bseg==='mine'){
    if(!AUTH||!BK.me)h+='<section class="panel"><p class="muted" style="font-size:13px">Log in to see your bets.</p><button type="button" class="cta" data-login="1" style="margin-top:10px">Log in</button></section>';
    else{var bets=BK.me.bets.filter(function(b){return b.status!=='cancelled'}),open=bets.filter(function(b){return b.status==='open'}),done=bets.filter(function(b){return b.status!=='open'});
      var w=done.filter(function(b){return b.status==='won'}).length,lo=done.filter(function(b){return b.status==='lost'}).length,pr=done.reduce(function(x,b){return x+(b.payout||0)-b.stake},0);
      h+='<section class="panel"><div class="stat3"><div class="stat"><small>Record</small><strong>'+w+'-'+lo+'</strong><span>W-L</span></div><div class="stat"><small>Profit</small><strong'+(pr<0?' style="color:var(--loss)"':'')+'>'+(pr>0?'+':'')+money(pr)+'</strong><span>settled bets</span></div><div class="stat"><small>In play</small><strong>'+money(BK.me.in_play)+'</strong><span>Bucks</span></div></div></section>';
      h+='<section class="panel"><div class="ph"><div><div class="kicker">Open</div><h2>Open bets</h2></div></div>'+(open.length?'<div>'+open.map(function(b){return betCard(b,true)}).join('')+'</div>':'<p class="muted">No open bets. Tap any price on the Lines tab.</p>')+'</section>';
      if(done.length)h+='<section class="panel"><div class="ph"><div><div class="kicker">Season</div><h2>Settled</h2></div></div><div>'+done.map(function(b){return betCard(b,true)}).join('')+'</div></section>';
    }
  }
  if(S.bseg==='leaders'){
    var lb=BK.lb||[];
    h+='<section class="panel"><div class="ph"><div><div class="kicker">Bucks + open bets</div><h2>Leaderboard</h2></div></div><div class="rows">'+
     lb.map(function(x){return '<div class="row" style="grid-template-columns:24px minmax(0,1fr) auto"><span class="rk'+(x.rank===1&&x.joined?' gold':'')+'">'+x.rank+'</span>'+who(x.user_id,x.joined?x.record+(x.in_play?' · '+money(x.in_play)+' in play':''):'Hasn\'t logged in yet',30)+'<span class="val">💵 '+money(x.bankroll)+'</span></div>'}).join('')+'</div></section>';
    var fd=BK.feed||[];
    h+='<section class="panel"><div class="ph"><div><div class="kicker">Who\'s on what</div><h2>Bet feed</h2></div></div>'+(fd.length?'<div>'+fd.map(function(b){return betCard(b,false)}).join('')+'</div>':'<p class="muted">Bets show up here as people place them.</p>')+'</section>';
  }
  if(S.bseg==='how')h+=bookRules();
  if(S.picks.length)h+='<div style="height:60px"></div><button type="button" class="slipbar" data-slip="1"><span>Bet slip · '+(S.picks.length===1?'1 pick':S.picks.length+'-pick parlay')+'</span><b>'+odds(slipOdds())+' ›</b></button>';
  return h+foot();
}
function bookRules(){var s=BS(),bt=D.backtest;
  return '<section class="panel"><div class="ph"><div><div class="kicker">House rules</div><h2>Mahomie Bucks only</h2></div></div><div class="rows">'+
   [['Bankroll',money(s.grant)+' Bucks once per season. No weekly refills: go broke and you\'re done until next year. The bankroll leader wins Sportsbook Champion.'],
    ['Bets',s.min_bet+' to '+s.max_bet+' Bucks each. Spread and total pay -110. Moneyline odds come from each team\'s win chance plus a 4.5% house edge.'],
    ['Parlays','2 to '+s.parlay_max_legs+' picks from different games. Every pick must win. A pushed pick drops out. Pays up to '+money(s.parlay_max_payout)+' back.'],
    ['Live betting','Lines post Tuesday 6 AM. Before kickoff you bet the posted line. Once the first player in a matchup kicks off, the odds go live: they move with the score and with how much of each lineup is left to play, so the further ahead a team gets, the worse its price. Nothing locks until every player in the matchup is done. If a game gets too lopsided, the favorite\'s moneyline comes off the board.'],
    ['Cancel','You can cancel a bet until its game kicks off. Live bets can\'t be cancelled.'],
    ['Your own game','Bet on yourself to win, to cover, or the over. Never against yourself, and never the under.'],
    ['Settling','Wednesday 3 AM, after Sleeper\'s stat corrections. Exact ties on a spread or total push (stake back).'],
    ['Login','Pick your team and a 4-digit PIN the first time. 5 wrong PINs locks it for 15 minutes. The commish can reset a PIN.']]
   .map(function(x){return '<div class="row" style="grid-template-columns:1fr"><div><b style="font-size:14px">'+x[0]+'</b><p class="muted" style="font-size:12.5px;line-height:1.5;margin-top:2px">'+x[1]+'</p></div></div>'}).join('')+'</div></section>'+
   '<section class="panel"><div class="ph"><div><div class="kicker">How the lines are made</div><h2>Built from your league\'s scores</h2></div></div><p class="muted" style="font-size:12.5px;line-height:1.55">Each team\'s projection = 45% its last 3 weeks, 35% its season average, 20% last season, pulled toward the league average (harder through Week 6). The gap between two projections, compared with how much both teams swing week to week, gives the win chance. Spreads max out at 20.</p>'+
   (bt&&bt.games?'<div class="stat3" style="margin-top:12px"><div class="stat"><small>Tested on</small><strong>'+bt.games+'</strong><span>past games</span></div><div class="stat"><small>Favorites won</small><strong>'+(bt.fav_pct*100).toFixed(1)+'%</strong><span>of games</span></div><div class="stat"><small>Avg miss</small><strong>'+f1(bt.mae)+'</strong><span>points</span></div></div>':'')+'</section>';
}

/* bet slip */
function slipHtml(){
  var n=S.picks.length,s=BS(),st=S.stake;if(!n)return '<p class="muted">Your slip is empty.</p>'+CLOSE;
  var bad=!(st>=s.min_bet&&st<=s.max_bet&&Math.round(st)===st)?'Bets are '+s.min_bet+' to '+s.max_bet+' Mahomie Bucks.':AUTH&&BK.me&&st>bank()?'Not enough Mahomie Bucks (you have '+money2(bank())+').':'';
  var h='<div class="ph" style="margin:0"><div><div class="kicker">Bet slip · '+(n===1?'straight bet':n+'-pick parlay')+'</div><h2 style="font-size:20px">'+(n===1?esc(legLabel(S.picks[0])):'Parlay '+odds(slipOdds()))+'</h2></div></div>';
  h+='<div class="legs">'+S.picks.map(function(p,i){var l=bl(p.line);return '<div class="leg"><div><b>'+esc(legLabel(p))+'</b><span>'+esc(team(l.a))+' vs '+esc(team(l.b))+' · '+(legOdds(p)==null?'off the board':odds(legOdds(p)))+' · '+esc(lockTxt(l))+'</span></div><button type="button" class="x" data-unpick="'+i+'" aria-label="Remove">✕</button></div>'}).join('')+'</div>';
  if(S.picks.some(function(p){return bl(p.line).live}))h+='<p class="muted" style="font-size:12px">Live price: it moves with the score. If it changes before you tap Place bet, you\'ll see the new one first.</p>';
  if(n===1)h+='<p class="muted" style="font-size:12px">Want a parlay? Close this and tap prices in other games.</p>';
  h+='<div class="stake"><input id="stake" type="number" inputmode="numeric" min="'+s.min_bet+'" max="'+s.max_bet+'" step="5" value="'+st+'" aria-label="Stake in Mahomie Bucks"><span class="kicker">'+(BK.me?'💵 '+money2(bank())+' left':'')+'</span></div>'+
   '<div class="quick">'+[10,25,50,100,250].map(function(v){return '<button type="button" data-stake="'+v+'">'+v+'</button>'}).join('')+'</div>'+
   '<div class="towin"><span>To win</span><b id="towin">'+(bad?'–':money2(Math.round(slipWin(st)*100)/100))+'</b></div><p class="err" id="slipErr">'+bad+'</p>';
  h+=AUTH?'<button type="button" class="cta" id="place"'+(bad?' disabled':'')+'>Place bet</button>':'<button type="button" class="cta" data-login="1">Log in to place it</button>';
  return h+'<button type="button" class="ghost" id="clearSlip">Clear slip</button>'+CLOSE;
}
function slipCheck(){var s=BS(),st=S.stake;var bad=!(st>=s.min_bet&&st<=s.max_bet)?'Bets are '+s.min_bet+' to '+s.max_bet+' Mahomie Bucks.':AUTH&&BK.me&&st>bank()?'Not enough Mahomie Bucks (you have '+money2(bank())+').':'';
  var tw=$('#towin');if(tw)tw.textContent=bad?'–':money2(Math.round(slipWin(st)*100)/100);var er=$('#slipErr');if(er)er.textContent=bad;var pl=$('#place');if(pl)pl.disabled=!!bad}
function togglePick(id,mkt,side){var l=bl(id);if(!l)return;if(isLk(l)){toast('That game is over');return}
  var i=S.picks.findIndex(function(p){return p.line===id&&p.mkt===mkt&&p.side===side});
  if(i>=0){S.picks.splice(i,1);render();return}
  var j=S.picks.findIndex(function(p){return p.line===id});
  if(j>=0)S.picks[j]={line:id,mkt:mkt,side:side};
  else{if(S.picks.length>=BS().parlay_max_legs){toast('Parlays max out at '+BS().parlay_max_legs+' picks');return}S.picks.push({line:id,mkt:mkt,side:side})}
  render();if(S.picks.length===1)openSheet(slipHtml());else toast(S.picks.length+'-pick parlay · '+odds(slipOdds()))}
function placeBet(btn){btn.disabled=true;btn.textContent='Placing…';
  api('/bets',{body:{legs:S.picks.map(function(p){return {line_id:p.line,market:p.mkt,pick:p.side,odds:legOdds(p),point:legPoint(p)}}),stake:S.stake}})
   .then(function(r){var n=S.picks.length;S.picks=[];closeSheetQuiet();if(BK.me)BK.me.balance=r.balance;toast(n>1?'Parlay placed 💵':'Bet placed 💵');S.bseg='mine';bookLoad();render()})
   .catch(function(e){btn.disabled=false;btn.textContent='Place bet';var msg=e.message;
     bookLoad().then(function(){if(!S.picks.length){closeSheetQuiet();toast(msg);return}openSheet(slipHtml());var er=$('#slipErr');if(er)er.textContent=/Odds moved/.test(msg)?'Odds moved. This is the new price. Tap Place bet again to take it.':msg})})}

/* login: pick team, then PIN pad */
function loginSheet(){
  if(!BK.teams)return '<p class="muted">Loading teams…</p>'+CLOSE;
  if(!S.lt)return '<div class="ph" style="margin:0"><div><div class="kicker">Sportsbook login</div><h2>Which team is yours?</h2></div></div><div class="rows">'+

/* ---------- GAME DETAIL ---------- */
var RN={high:'Highest score',low:'Lowest score',blowout:'Biggest blowout',close:'Closest game',hiloss:'Most points in a loss',lowin:'Fewest points in a win',player:'Best player game'};
function tnS(s,u){return ((D.seasons[s]&&D.seasons[s].team_names[u])||M(u).name).trim()}
function gameRecs(g){var out=[];
  ['high','low','player'].forEach(function(k){D.records[k].forEach(function(x,i){if(x.s===g.s&&x.w===g.w&&(x.uid===g.win||x.uid===g.lose))out.push({k:k,n:i+1})})});
  ['blowout','close','hiloss','lowin'].forEach(function(k){D.records[k].forEach(function(x,i){if(x.s===g.s&&x.w===g.w&&x.win===g.win&&x.lose===g.lose)out.push({k:k,n:i+1})})});
  return out.sort(function(a,b){return a.n-b.n})}
function entering(g,u){var w=0,l=0;D.games.forEach(function(x){if(x.s!==g.s||x.w>=g.w||x.k!=='Regular season')return;if(x.win===u)w++;else if(x.lose===u)l++});return w+'-'+l}
function series(g){var a=0,b=0;D.games.forEach(function(x){if(x.s>g.s||(x.s===g.s&&x.w>g.w))return;if(x.win===g.win&&x.lose===g.lose)a++;else if(x.win===g.lose&&x.lose===g.win)b++});return [a,b]}
function weekScores(s,w){var out=[];Object.keys(D.tw).forEach(function(k){var p=k.split('|');if(p[0]===s&&+p[1]===w&&D.tw[k][0]>0)out.push({u:p[2],p:D.tw[k][0]})});return out.sort(function(a,b){return b.p-a.p})}
function topP(s,w,u){var t=D.tw[s+'|'+w+'|'+u];if(!t)return null;var pid=t[1];return {name:D.names[pid]||(/^[A-Z]+$/.test(pid)?pid+' defense':null),pts:t[2]}}
function ord(n){var s=['th','st','nd','rd'],v=n%100;return n+(s[(v-20)%10]||s[v]||s[0])}
function gameSheet(i){
  var g=D.games[i];if(!g)return '<p class="muted">Game not found.</p>';
  var ws=weekScores(g.s,g.w),rank=function(u){for(var j=0;j<ws.length;j++)if(ws[j].u===u)return j+1;return '–'},avg=ws.reduce(function(a,x){return a+x.p},0)/Math.max(1,ws.length),sr=series(g),recs=gameRecs(g);
  var side=function(u,p,won){return '<div class="sb-row'+(won?' won':'')+'">'+who(u,tnS(g.s,u)===team(u)?M(u).name:'as '+tnS(g.s,u),40)+'<div class="sb-pts num">'+f2(p)+'</div></div>'};
  var h='<section class="hero gs"><div class="eyebrow">'+g.s+' · Week '+g.w+' · '+esc(g.k)+'</div><div class="sb">'+side(g.win,g.wp,true)+side(g.lose,g.lp,false)+'</div>'+
   '<p class="margin">'+esc(tnS(g.s,g.win))+' won by <b class="num">'+f2(g.m)+'</b></p>'+
   (recs.length?'<div class="badges">'+recs.map(function(r){return '<span class="badge">#'+r.n+' '+RN[r.k]+'</span>'}).join('')+'</div>':'')+'</section>';
  var pa=topP(g.s,g.w,g.win),pb=topP(g.s,g.w,g.lose);
  var pr=function(u,p){return '<div class="row"><div><b style="font-size:14px">'+esc(p&&p.name?p.name:'Top scorer')+'</b><div class="muted" style="font-size:11.5px">for '+esc(tnS(g.s,u))+'</div></div><span class="val">'+(p?f1(p.pts):'–')+'</span></div>'};
  h+='<section class="panel"><div class="ph"><div><div class="kicker">Best player on each side</div><h2>Top performers</h2></div></div><div class="rows">'+pr(g.win,pa)+pr(g.lose,pb)+'</div></section>';
  h+='<section class="panel"><div class="ph"><div><div class="kicker">The matchup</div><h2>By the numbers</h2></div></div><div class="stat3">'+
   '<div class="stat"><small>Came in</small><strong>'+entering(g,g.win)+'</strong><span>'+esc(M(g.win).name)+'</span></div>'+
   '<div class="stat"><small>All-time series</small><strong>'+sr[0]+'-'+sr[1]+'</strong><span>after this game</span></div>'+
   '<div class="stat"><small>Came in</small><strong>'+entering(g,g.lose)+'</strong><span>'+esc(M(g.lose).name)+'</span></div></div>'+
   '<div class="stat3" style="margin-top:8px"><div class="stat"><small>Week rank</small><strong>'+ord(rank(g.win))+'</strong><span>of '+ws.length+'</span></div><div class="stat"><small>League avg</small><strong>'+f1(avg)+'</strong><span>that week</span></div><div class="stat"><small>Week rank</small><strong>'+ord(rank(g.lose))+'</strong><span>of '+ws.length+'</span></div></div></section>';
  var mx=ws.length?ws[0].p:1;
  h+='<section class="panel"><div class="ph"><div><div class="kicker">'+g.s+' · Week '+g.w+'</div><h2>Every score that week</h2></div></div>'+
   ws.map(function(x,j){var hl=x.u===g.win||x.u===g.lose;return '<div class="wk'+(hl?' hl':'')+'"><span class="rk'+(j===0?' gold':'')+'" style="width:22px;height:22px;font-size:10px">'+(j+1)+'</span><div style="min-width:0"><b>'+esc(tnS(g.s,x.u))+'</b><div class="bar"><i style="width:'+(x.p/mx*100).toFixed(1)+'%"></i></div></div><span class="p">'+f2(x.p)+'</span></div>'}).join('')+'</section>';
  h+=LIVE?'<section class="panel"><div class="ph"><div><div class="kicker">Box score</div><h2>Lineups</h2></div></div><div id="lineups"><p class="muted">Loading lineups from Sleeper…</p></div></section>':
    '<p class="note"><b>Full lineups coming.</b> Every starter and bench player with their points loads straight from Sleeper once the app is live on Railway.</p>';
  return h;
}

function loadLineups(i){
  if(!LIVE)return;var g=D.games[i];
  fetch('/api/game?season='+g.s+'&week='+g.w+'&users='+g.win+','+g.lose).then(function(r){return r.json()}).then(function(d){
    var el=document.getElementById('lineups');if(!el)return;
    if(!d||!d.teams||d.error){el.innerHTML='<p class="err">Couldn\'t load lineups: '+esc(d&&d.error||'unknown error')+'</p>';return}
    el.innerHTML=lineupHtml(g,d);
  }).catch(function(){var el=document.getElementById('lineups');if(el)el.innerHTML='<p class="err">Couldn\'t reach the server for lineups.</p>'});

function sdOf(arr){if(arr.length<2)return 0;var m=arr.reduce(function(a,b){return a+b},0)/arr.length;return Math.sqrt(arr.reduce(function(a,b){return a+(b-m)*(b-m)},0)/arr.length)}

  if(d.shareRec){shareRecord();return}
  if(d.shareGame){shareGame(+d.shareGame);return}
  if(d.shareSeason){shareSeason(d.shareSeason);return}
  if(d.bk){var a=d.bk.split('|');if(!AUTH){S.picks=[{line:a[0],mkt:a[1],side:a[2]}];render();openLogin();return}togglePick(a[0],a[1],a[2]);return}
  if(d.slip){openSheet(slipHtml());return}
  if(d.unpick!==undefined){S.picks.splice(+d.unpick,1);render();if(S.picks.length)openSheet(slipHtml());else closeSheetQuiet();return}
  if(d.stake){S.stake=+d.stake;openSheet(slipHtml());return}
  if(t.id==='place'){placeBet(t);return}
  if(t.id==='clearSlip'){S.picks=[];closeSheetQuiet();render();return}
  if(d.bcancel){t.disabled=true;api('/bets/'+d.bcancel+'/cancel',{method:'POST'}).then(function(){toast('Bet cancelled, Bucks returned');bookLoad()}).catch(function(e){t.disabled=false;toast(e.message)});return}
  if(d.login){openLogin();return}
  if(d.lteam){S.lt=d.lteam;S.pin='';S.pin1=null;S.pinErr='';openSheet(loginSheet());return}
  if(d.key){pinKey(d.key);return}
  if(d.pinback){S.lt=null;S.pin='';S.pin1=null;S.pinErr='';openSheet(loginSheet());return}
  if(d.logout){logout();return}
  if(d.adm){openSheet(admSheet(d.adm,d.arg));if(d.adm==='log')loadLog();return}
  if(d.admgo){admGo(d.admgo,d.arg,t);return}
  if(d.bkreload){BK.on=null;render();bookLoad();return}
  if(t.id==='bucksBtn'){go('book');bookLoad();return}
  if(d.bye){openSheet(byeSheet(d.bye)+CLOSE);loadByeLineup(d.bye);return}
  if(d.game!==undefined){var gx=+d.game;if(gx>=0){openSheet(gameSheet(gx)+'<button type="button" class="share-btn wide" data-share-game="'+gx+'">Share this game</button>'+CLOSE);loadLineups(gx);return}}
  if(d.mgr){openSheet(profile(d.mgr,false)+CLOSE);return}
  if(t.id==='closeP'){closeSheet();return}
});
document.addEventListener('change',function(e){
  if(e.target.id==='meSel'){S.me=e.target.value;store('me',S.me);S.h2a=S.me;S.h2b=null;render();toast('Playing as '+team(S.me))}
  if(e.target.id==='h2a'){S.h2a=e.target.value;render()}
  if(e.target.id==='h2b'){S.h2b=e.target.value;render()}
});
document.addEventListener('input',function(e){
  if(e.target.id==='stake'){S.stake=Math.round(+e.target.value||0);slipCheck()}
});
$('#scrim').addEventListener('click',closeSheet);
document.addEventListener('keydown',function(e){if(e.key==='Escape')closeSheet()});
var h=(location.hash||'').replace('#','');if(['home','league','records','book','me'].indexOf(h)>=0)S.tab=h;
render();
})();
</script>
