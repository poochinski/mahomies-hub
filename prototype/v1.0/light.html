<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><link rel="icon" href="/favicon.svg"><link rel="apple-touch-icon" href="/apple-touch-icon.png"></head><body><title>Mahomie's Hub</title>
<meta name="theme-color" content="#2f3238">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap">
<style>
/* Layout: Banana Bets shell for phones — sticky brand bar, scrolling content, fixed 5-tab bar, bottom sheets for profiles and the bet slip. Single committed light look, matching Banana Bets. */
:root{
  color-scheme:light;
  --bg:#ececef; --bg-2:#e2e3e7;
  --surface:#f8f8f7; --surface-2:#efeff1; --surface-3:#dedee2;
  --border:#a8aab1; --border-soft:#d6d7db;
  --text:#303238; --text-soft:#686b73; --text-faint:#8b8e95;
  --dark:#3b3e45; --slate-1:#41444b; --slate-2:#2f3238; --slate-3:#25282d; --slate-line:#5b5e65;
  --on-slate:#f3f3f4; --on-slate-soft:#b9bcc3;
  --blue:#0862d9; --blue-light:#1875ef; --blue-on-slate:#4a9aff;
  --green:#00a76d; --green-light:#10be80; --green-on-slate:#29d195;
  --red:#d91e2c; --red-light:#ef3b46; --red-on-slate:#ff7a82;
  --yellow:#e7b92f; --yellow-light:#f6cf4c; --yellow-ink:#7a6010;
  --f:"Inter",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --tab-h:62px;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:var(--f);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
body{min-height:100%;background:linear-gradient(180deg,#f4f4f5,var(--bg) 320px)}
button{font:inherit;color:inherit;cursor:pointer}
h1,h2,h3{margin:0;text-wrap:balance}
p{margin:0}
.num{font-variant-numeric:tabular-nums}
:focus-visible{outline:2px solid var(--yellow);outline-offset:2px}

/* ---------- top bar ---------- */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 16px;background:rgba(241,241,243,.94);border-bottom:1px solid var(--border);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
.brand{display:flex;align-items:center;gap:9px;min-width:0}
.mark{width:34px;height:34px;border-radius:10px;flex:0 0 auto;box-shadow:0 3px 8px rgba(41,43,48,.2)}
.bname{font-size:16px;font-weight:900;letter-spacing:-.6px;line-height:1;color:var(--dark);white-space:nowrap}
.bname b{color:#62656c;font-weight:900}
.bsub{font-size:8px;font-weight:900;letter-spacing:.9px;color:#6a6d75;margin-top:4px;white-space:nowrap}
.bucks{display:flex;align-items:center;gap:6px;padding:6px 10px;border-radius:20px;border:1px solid rgba(231,185,47,.55);background:rgba(231,185,47,.16);color:#5f4a07;font-weight:900;font-size:13px;white-space:nowrap}
.bucks small{font-size:9px;letter-spacing:.6px;color:#8a6b00;font-weight:900}

/* ---------- layout ---------- */
main{max-width:720px;margin:0 auto;padding-inline:12px;padding-block:12px calc(var(--tab-h) + env(safe-area-inset-bottom,0px) + 24px);display:grid;gap:12px}
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:40;display:grid;grid-template-columns:repeat(5,1fr);padding-bottom:env(safe-area-inset-bottom,0px);background:rgba(244,244,245,.97);border-top:1px solid var(--border);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
.tab{height:var(--tab-h);border:0;background:none;display:grid;place-items:center;align-content:center;gap:3px;color:#80838a;font-size:10.5px;font-weight:800;position:relative}
.tab svg{width:23px;height:23px}
.tab.on{color:var(--dark)}
.tab.on::before{content:"";position:absolute;top:0;left:30%;right:30%;height:3px;border-radius:0 0 3px 3px;background:var(--yellow)}
.tab.on svg{color:var(--dark)}

/* ---------- hero ---------- */
.hero{position:relative;overflow:hidden;padding:18px 15px 15px;border:1px solid #72757c;border-radius:17px;color:var(--on-slate);
  background:radial-gradient(circle at 88% 4%,rgba(24,117,239,.17),transparent 32%),radial-gradient(circle at 4% 100%,rgba(231,185,47,.10),transparent 34%),linear-gradient(135deg,var(--slate-1) 0%,var(--slate-2) 52%,var(--slate-3) 100%);box-shadow:0 10px 26px rgba(30,32,37,.18)}
.hero::before{content:"";position:absolute;inset:0;pointer-events:none;opacity:.15;background-image:linear-gradient(rgba(255,255,255,.07) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.045) 1px,transparent 1px);background-size:28px 28px}
.hero>*{position:relative}
.eyebrow{color:var(--yellow);font-size:10px;font-weight:900;letter-spacing:2px;text-transform:uppercase}
.hero h1{color:#fafafa;font-size:32px;font-weight:900;letter-spacing:-1.3px;line-height:1;margin:6px 0 5px}
.hero .sub{color:#c3c5ca;font-size:13px;line-height:1.5}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}
.tile{position:relative;overflow:hidden;padding:11px 11px 10px;border:1px solid var(--slate-line);border-radius:12px;background:linear-gradient(150deg,rgba(255,255,255,.075),rgba(255,255,255,.025));text-align:left;border-width:1px;color:inherit;min-width:0}
.tile::before{content:"";position:absolute;top:0;left:0;right:0;height:3px}
.t-y::before{background:var(--yellow)}.t-b::before{background:var(--blue-light)}.t-g::before{background:var(--green-light)}.t-r::before{background:var(--red-light)}.t-k::before{background:#a7aab1}
.tile small{display:block;font-size:9px;font-weight:900;letter-spacing:1px;color:#a4a7ae;text-transform:uppercase}
.tile strong{display:block;font-size:22px;font-weight:900;letter-spacing:-.6px;margin-top:4px;line-height:1.05}
.t-y strong{color:var(--yellow-light)}.t-b strong{color:var(--blue-on-slate)}.t-g strong{color:var(--green-on-slate)}.t-r strong{color:var(--red-on-slate)}
.tile span{display:block;color:#c2c4c9;font-size:11.5px;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* ---------- panels ---------- */
.panel{padding:14px;border:1px solid var(--border-soft);border-radius:14px;background:var(--surface);box-shadow:0 4px 14px rgba(42,44,50,.05);min-width:0}
.ph{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;margin-bottom:10px}
.kicker{font-size:9.5px;font-weight:900;letter-spacing:1.7px;color:#84878e;text-transform:uppercase}
.ph h2{font-size:18px;font-weight:900;color:var(--dark);letter-spacing:-.3px;margin-top:2px}
.link{border:0;background:none;color:var(--blue);font-size:12.5px;font-weight:800;padding:6px 0;white-space:nowrap}
.note{font-size:12px;line-height:1.5;padding:9px 11px;border-radius:9px;border:1px solid rgba(231,185,47,.45);background:rgba(231,185,47,.12);color:#5e4b0e}
.muted{color:var(--text-soft)}

/* avatar + team line */
.av{flex:0 0 auto;display:grid;place-items:center;border-radius:50%;font-weight:900;color:#fff;letter-spacing:-.3px}
.who{display:flex;align-items:center;gap:9px;min-width:0;border:0;background:none;padding:0;text-align:left}
.who .tx{min-width:0}
.who .tx>b{display:block;font-size:14px;font-weight:800;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.who .tx>span{display:block;font-size:11.5px;color:var(--text-soft);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* list rows */
.rows{display:grid}
.row{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:10px;padding:10px 0;border-top:1px solid #e3e3e6}
.row:first-child{border-top:0;padding-top:2px}
.val{font-weight:900;font-size:16px;text-align:right;font-variant-numeric:tabular-nums}
.val small{display:block;font-size:10.5px;font-weight:700;color:var(--text-faint)}
.rk{width:24px;height:24px;border-radius:50%;background:var(--dark);color:var(--yellow);display:grid;place-items:center;font-size:11px;font-weight:900;flex:0 0 auto}
.rk.gold{background:var(--yellow);color:#3a2f05}

/* segmented + chips */
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;padding:3px;border:1px solid #c7c9ce;border-radius:11px;background:#e6e7ea;gap:2px}
.seg button{border:0;background:none;min-height:36px;border-radius:8px;font-size:12.5px;font-weight:800;color:#696c73}
.seg button.on{background:var(--dark);color:#fff;box-shadow:0 3px 8px rgba(38,40,45,.18)}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none;margin-inline:-12px;padding-inline:12px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;border:1px solid #c4c6cb;background:var(--surface);border-radius:18px;padding:8px 12px;font-size:12.5px;font-weight:800;color:#5c5f66;white-space:nowrap}
.chip.on{background:var(--dark);border-color:var(--dark);color:#fff}

/* matchup cards (home + book) */
.mu{border:1px solid var(--border-soft);border-radius:13px;background:var(--surface);overflow:hidden}
.mu-h{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 12px;background:var(--surface-2);border-bottom:1px solid var(--border-soft);font-size:10.5px;font-weight:900;letter-spacing:.7px;color:#7a7d84;text-transform:uppercase}
.live{display:inline-flex;align-items:center;gap:5px;color:#007e53}
.live i{width:7px;height:7px;border-radius:50%;background:var(--green);box-shadow:0 0 0 3px rgba(0,167,109,.18)}
.mu-t{display:grid;grid-template-columns:minmax(0,1fr) 62px 62px;gap:6px;align-items:center;padding:8px 12px}
.mu-t+.mu-t{border-top:1px dashed #e0e1e4}
.ob{border:1px solid #cfd1d5;background:#fff;border-radius:9px;min-height:44px;display:grid;place-items:center;align-content:center;gap:1px;font-weight:900;font-size:13.5px;font-variant-numeric:tabular-nums;color:var(--text)}
.ob small{font-size:9.5px;font-weight:800;color:var(--text-faint)}
.ob.fav{color:var(--blue)}
.ob.sel{background:var(--dark);border-color:var(--dark);color:#fff}
.ob.sel small{color:var(--yellow-light)}
.ob[disabled]{opacity:.45}
.mu-tot{display:grid;grid-template-columns:minmax(0,1fr) 62px 62px;gap:6px;align-items:center;padding:8px 12px 10px;border-top:1px solid #e9e9eb;background:#fbfbfa}
.mu-tot span{font-size:12px;font-weight:800;color:var(--text-soft)}
.colh{display:grid;grid-template-columns:minmax(0,1fr) 62px 62px;gap:6px;padding:0 12px;font-size:9.5px;font-weight:900;letter-spacing:.8px;color:var(--text-faint);text-transform:uppercase}
.colh span{text-align:center}
.score{font-size:12px;font-weight:800;color:var(--text-soft);font-variant-numeric:tabular-nums}

/* simple matchup result line (home) */
.res{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 10px;padding:9px 0;border-top:1px solid #e3e3e6;align-items:center}
.res:first-child{border-top:0;padding-top:2px}
.res .s{font-weight:900;font-variant-numeric:tabular-nums;text-align:right;font-size:14px}
.res .lose b,.res .lose .s{color:var(--text-faint);font-weight:700}

/* tables */
.tw{overflow-x:auto;margin-inline:-14px;padding-inline:14px}
table{width:100%;border-collapse:collapse;font-size:12.5px}
th{font-size:9.5px;font-weight:900;letter-spacing:.7px;text-transform:uppercase;color:var(--text-faint);text-align:right;padding:6px 6px;border-bottom:1px solid var(--border-soft);white-space:nowrap}
td{padding:9px 6px;border-bottom:1px solid #e6e6e9;text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
th:first-child,td:first-child{text-align:left;padding-left:0}
td.tm{max-width:150px;overflow:hidden;text-overflow:ellipsis}
tr.me td{background:rgba(231,185,47,.10)}
tr.cut td{border-bottom:2px solid var(--yellow)}
.pos{color:var(--green);font-weight:800}.negv{color:var(--red);font-weight:800}

/* power bars */
.pbar{height:6px;border-radius:6px;background:#e4e5e8;overflow:hidden;margin-top:5px}
.pbar i{display:block;height:100%;border-radius:6px;background:linear-gradient(90deg,var(--yellow),var(--yellow-light))}
.mv{font-size:11px;font-weight:900;min-width:30px;text-align:right}
.mv.up{color:var(--green)}.mv.dn{color:var(--red)}.mv.eq{color:var(--text-faint)}

/* history cards */
.season{border:1px solid var(--border-soft);border-radius:14px;background:var(--surface);overflow:hidden}
.season-h{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;background:linear-gradient(135deg,var(--slate-1),var(--slate-3));color:#fff}
.season-h b{font-size:22px;font-weight:900;letter-spacing:-.8px}
.season-h span{font-size:10px;font-weight:900;letter-spacing:1.4px;color:var(--yellow-light)}
.podium{display:grid;gap:0;padding:4px 14px}
.pod{display:grid;grid-template-columns:30px minmax(0,1fr) auto;gap:8px;align-items:center;padding:9px 0;border-top:1px solid #e6e6e9}
.pod:first-child{border-top:0}
.medal{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-size:14px}
.m-1{background:var(--yellow)}.m-2{background:#cfd1d5}.m-3{background:#d9a777}.m-s{background:rgba(217,30,44,.12)}
.lbl{font-size:10px;font-weight:900;letter-spacing:.7px;text-transform:uppercase;color:var(--text-faint);text-align:right}
.lbl.r{color:var(--red)}
.season-f{display:flex;gap:8px;flex-wrap:wrap;padding:10px 14px 12px;border-top:1px solid #e6e6e9;background:var(--surface-2)}
.pill{font-size:11px;font-weight:800;padding:5px 9px;border-radius:12px;background:#fff;border:1px solid var(--border-soft);color:var(--text-soft)}
.pill b{color:var(--text)}

/* records */
.rec-hero{display:grid;gap:4px}
.rec-hero .big{font-size:44px;font-weight:900;letter-spacing:-2px;line-height:1;color:var(--yellow-light);font-variant-numeric:tabular-nums}
.rec-hero .holder{display:flex;align-items:center;gap:9px;margin-top:10px}
.rec-hero .holder .tx>b{color:#fff;font-size:15px}
.rec-hero .holder .tx>span{color:#b9bcc3;font-size:12px;display:block}
.who .new,.new{display:inline-block;font-size:9px;font-weight:900;letter-spacing:.6px;color:#007e53;background:rgba(0,167,109,.12);padding:2px 6px;border-radius:6px;margin-left:6px;vertical-align:2px}

/* rivalry */
.vs{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:8px;align-items:center;text-align:center}
.vs .side{display:grid;justify-items:center;gap:6px;min-width:0}
.vs .side b{font-size:13px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.vs .side strong{font-size:34px;font-weight:900;letter-spacing:-1px;font-variant-numeric:tabular-nums}
.vs .mid{font-size:11px;font-weight:900;color:var(--text-faint);letter-spacing:1px}
select{font:inherit;font-size:14px;font-weight:700;width:100%;min-height:44px;border:1px solid #c4c6cb;border-radius:10px;background:#fff;color:var(--text);padding:0 10px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.stat3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.stat{padding:10px;border:1px solid #e0e1e4;border-radius:10px;background:var(--surface-2);text-align:center;min-width:0}
.stat small{display:block;font-size:9.5px;font-weight:900;letter-spacing:.6px;color:var(--text-faint);text-transform:uppercase}
.stat strong{display:block;font-size:18px;font-weight:900;margin-top:3px;font-variant-numeric:tabular-nums}
.stat span{display:block;font-size:10.5px;color:var(--text-soft);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* book */
.bk-hero .bank{font-size:40px;font-weight:900;letter-spacing:-1.6px;color:var(--yellow-light);line-height:1;margin-top:6px;font-variant-numeric:tabular-nums}
.bet{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 10px;padding:11px 0;border-top:1px solid #e3e3e6;align-items:center}
.bet:first-child{border-top:0;padding-top:2px}
.bet b{font-size:14px}
.bet span{font-size:11.5px;color:var(--text-soft)}
.st{font-size:10px;font-weight:900;letter-spacing:.6px;padding:4px 8px;border-radius:9px;text-transform:uppercase}
.st.pending{background:rgba(8,98,217,.10);color:var(--blue)}
.x{border:1px solid var(--border-soft);background:#fff;border-radius:8px;font-size:11.5px;font-weight:800;color:var(--text-soft);padding:6px 9px;min-height:32px}

/* sheet */
.scrim{position:fixed;inset:0;z-index:60;background:rgba(28,30,34,.48);opacity:0;pointer-events:none;transition:opacity .2s}
.scrim.open{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:61;max-height:88vh;overflow-y:auto;background:var(--bg);border-radius:20px 20px 0 0;padding:8px 12px calc(env(safe-area-inset-bottom,0px) + 18px);transform:translateY(105%);visibility:hidden;transition:transform .26s cubic-bezier(.2,.8,.2,1),visibility 0s .26s;box-shadow:0 -10px 40px rgba(20,22,26,.3);max-width:720px;margin:0 auto}
.sheet.open{transform:none;visibility:visible;transition:transform .26s cubic-bezier(.2,.8,.2,1)}
.grab{width:40px;height:5px;border-radius:5px;background:#c3c5ca;margin:2px auto 10px}
.sheet-body{display:grid;gap:12px}
.stake{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center}
.stake input{font:inherit;font-size:22px;font-weight:900;width:100%;min-height:52px;border:1px solid #c4c6cb;border-radius:12px;padding:0 14px;background:#fff;color:var(--text);font-variant-numeric:tabular-nums}
.quick{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.quick button{min-height:40px;border:1px solid #c4c6cb;background:#fff;border-radius:10px;font-weight:900;font-size:13px}
.cta{width:100%;min-height:52px;border:1px solid #d2a91f;border-radius:13px;background:var(--yellow);color:#33353a;font-size:16px;font-weight:900}
.cta[disabled]{opacity:.45}
.ghost{width:100%;min-height:44px;border:1px solid #c4c6cb;border-radius:12px;background:#fff;font-weight:800;color:var(--text-soft)}
.towin{display:flex;justify-content:space-between;font-size:13px;color:var(--text-soft)}
.towin b{color:var(--green);font-size:16px}
.err{color:var(--red);font-size:12.5px;font-weight:700}

.trophies{display:flex;gap:6px;flex-wrap:wrap}
.tr{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:900;padding:5px 9px;border-radius:12px}
.tr.c{background:rgba(231,185,47,.2);color:#6e560c}.tr.r{background:#e6e7ea;color:#55585f}.tr.s{background:rgba(217,30,44,.1);color:#a3202b}.tr.p{background:rgba(8,98,217,.09);color:var(--blue)}
.toast{position:fixed;left:50%;bottom:calc(var(--tab-h) + env(safe-area-inset-bottom,0px) + 14px);transform:translate(-50%,20px);z-index:70;background:var(--dark);color:#fff;font-weight:800;font-size:13.5px;padding:11px 16px;border-radius:12px;opacity:0;transition:.22s;pointer-events:none;box-shadow:0 8px 20px rgba(0,0,0,.25);max-width:calc(100% - 32px)}
.toast.show{opacity:1;transform:translate(-50%,0)}
.foot{text-align:center;font-size:11px;color:var(--text-faint);padding:6px 0 2px}
.dots{display:inline-flex;gap:5px;vertical-align:middle;margin-right:6px}
.dots i{width:8px;height:8px;border-radius:50%;display:block}
@media (min-width:600px){.hero{padding:22px 22px 18px}.hero h1{font-size:38px}.tiles{grid-template-columns:repeat(4,minmax(0,1fr))}}
@media (prefers-reduced-motion:reduce){.sheet,.scrim,.toast{transition:none}}
/* game detail + tappable rows */
button.row,button.res{width:100%;border:0;border-top:1px solid #e3e3e6;background:none;text-align:left;color:inherit;font:inherit}
button.row:first-child,button.res:first-child{border-top:0}
button.row:active,button.res:active{background:rgba(231,185,47,.10)}
.chev{color:var(--text-faint);font-size:22px;font-weight:700;line-height:1;text-align:right}
.sb{display:grid;gap:8px;margin-top:12px}
.sb-row{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--slate-line);border-radius:12px;background:rgba(255,255,255,.04)}
.sb-row .who .tx>b{color:#fff}.sb-row .who .tx>span{color:#b9bcc3}
.sb-pts{font-size:28px;font-weight:900;color:#9ea1a8;letter-spacing:-.8px}
.sb-row.won{border-color:var(--yellow)}.sb-row.won .sb-pts{color:var(--yellow-light)}

/* ---------- RECORDS ---------- */
var RECS=[
 ['high','Highest score','team'],['low','Lowest score','team'],['blowout','Biggest blowout','game'],['close','Closest game','game'],
 ['hiloss','Most points in a loss','game'],['lowin','Fewest points in a win','game'],['player','Best player game','player'],
 ['seasonhi','Most points · season','season'],['seasonlo','Fewest points · season','season'],['wstreak','Longest win streak','streak'],['lstreak','Longest losing streak','streak']];
function recVal(k,x){var t=RECS.find(function(r){return r[0]===k})[2];
  if(t==='team')return {u:x.uid,v:f2(x.v),sub:sw(x.s,x.w)};
  if(t==='player')return {u:x.uid,v:f1(x.v),sub:x.name+' ('+x.pos+') · '+sw(x.s,x.w)};
  if(t==='season')return {u:x.uid,v:f1(x.v),sub:x.s+' · '+x.rec};
  if(t==='streak')return {u:x.uid,v:x.n+(x.t==='W'?' W':' L'),sub:x.start+' → '+x.end+(x.live?' · active':'')};
  var g=x;var u=(k==='hiloss')?g.lose:g.win;
  var v=k==='blowout'||k==='close'?f2(g.m):k==='hiloss'?f2(g.lp):f2(g.wp);
  return {u:u,v:v,sub:(k==='hiloss'?'lost to ':'beat ')+M(k==='hiloss'?g.win:g.lose).name+' '+f2(k==='hiloss'?g.wp:g.wp)+'–'+f2(g.lp)+' · '+sw(g.s,g.w)+(g.k!=='Regular season'?' · '+g.k:'')};
}
function recGame(k,x){var t=RECS.find(function(r){return r[0]===k})[2];
  if(t==='team'||t==='player')return gi(x.s,x.w,x.uid);
  if(t==='game')return gi(x.s,x.w,x.win);return -1}

function sideRow(l,s){var u=s==='a'?l.a:l.b,sp=s==='a'?-l.spread:l.spread,ml=s==='a'?l.ml_a:l.ml_b,fav=sp<0;
  return '<div class="mu-t">'+who(u,'proj '+f1(s==='a'?l.pa:l.pb),30)+ob(l.id,'sp',s,spr(sp),-110,fav)+ob(l.id,'ml',s,odds(ml),null,fav)+'</div>'}
function ownBlocked(l,mkt,side){var me=S.me;if(l.a!==me&&l.b!==me)return false;if(mkt==='tot')return false;var mine=(l.a===me?'a':'b');return side!==mine}

/* ---------- GAME DETAIL ---------- */
var RN={high:'Highest score',low:'Lowest score',blowout:'Biggest blowout',close:'Closest game',hiloss:'Most points in a loss',lowin:'Fewest points in a win',player:'Best player game'};
function tnS(s,u){return ((D.seasons[s]&&D.seasons[s].team_names[u])||M(u).name).trim()}
function gameRecs(g){var out=[];
  ['high','low','player'].forEach(function(k){D.records[k].forEach(function(x,i){if(x.s===g.s&&x.w===g.w&&(x.uid===g.win||x.uid===g.lose))out.push({k:k,n:i+1})})});
  ['blowout','close','hiloss','lowin'].forEach(function(k){D.records[k].forEach(function(x,i){if(x.s===g.s&&x.w===g.w&&x.win===g.win&&x.lose===g.lose)out.push({k:k,n:i+1})})});
  return out.sort(function(a,b){return a.n-b.n})}
function entering(g,u){var w=0,l=0;D.games.forEach(function(x){if(x.s!==g.s||x.w>=g.w||x.k!=='Regular season')return;if(x.win===u)w++;else if(x.lose===u)l++});return w+'-'+l}
function series(g){var a=0,b=0;D.games.forEach(function(x){if(x.s>g.s||(x.s===g.s&&x.w>g.w))return;if(x.win===g.win&&x.lose===g.lose)a++;else if(x.win===g.lose&&x.lose===g.win)b++});return [a,b]}
function weekScores(s,w){var out=[];Object.keys(D.tw).forEach(function(k){var p=k.split('|');if(p[0]===s&&+p[1]===w&&D.tw[k][0]>0)out.push({u:p[2],p:D.tw[k][0]})});return out.sort(function(a,b){return b.p-a.p})}
function topP(s,w,u){var t=D.tw[s+'|'+w+'|'+u];if(!t)return null;var pid=t[1];return {name:D.names[pid]||(/^[A-Z]+$/.test(pid)?pid+' defense':null),pts:t[2]}}
function ord(n){var s=['th','st','nd','rd'],v=n%100;return n+(s[(v-20)%10]||s[v]||s[0])}
function gameSheet(i){
  var g=D.games[i];if(!g)return '<p class="muted">Game not found.</p>';
  var ws=weekScores(g.s,g.w),rank=function(u){for(var j=0;j<ws.length;j++)if(ws[j].u===u)return j+1;return '–'},avg=ws.reduce(function(a,x){return a+x.p},0)/Math.max(1,ws.length),sr=series(g),recs=gameRecs(g);
  var side=function(u,p,won){return '<div class="sb-row'+(won?' won':'')+'">'+who(u,tnS(g.s,u)===team(u)?M(u).name:'as '+tnS(g.s,u),40)+'<div class="sb-pts num">'+f2(p)+'</div></div>'};
  var h='<section class="hero gs"><div class="eyebrow">'+g.s+' · Week '+g.w+' · '+esc(g.k)+'</div><div class="sb">'+side(g.win,g.wp,true)+side(g.lose,g.lp,false)+'</div>'+
   '<p class="margin">'+esc(tnS(g.s,g.win))+' won by <b class="num">'+f2(g.m)+'</b></p>'+
   (recs.length?'<div class="badges">'+recs.map(function(r){return '<span class="badge">#'+r.n+' '+RN[r.k]+'</span>'}).join('')+'</div>':'')+'</section>';
  var pa=topP(g.s,g.w,g.win),pb=topP(g.s,g.w,g.lose);
  var pr=function(u,p){return '<div class="row"><div><b style="font-size:14px">'+esc(p&&p.name?p.name:'Top scorer')+'</b><div class="muted" style="font-size:11.5px">for '+esc(tnS(g.s,u))+'</div></div><span class="val">'+(p?f1(p.pts):'–')+'</span></div>'};
  h+='<section class="panel"><div class="ph"><div><div class="kicker">Best player on each side</div><h2>Top performers</h2></div></div><div class="rows">'+pr(g.win,pa)+pr(g.lose,pb)+'</div></section>';
  h+='<section class="panel"><div class="ph"><div><div class="kicker">The matchup</div><h2>By the numbers</h2></div></div><div class="stat3">'+
   '<div class="stat"><small>Came in</small><strong>'+entering(g,g.win)+'</strong><span>'+esc(M(g.win).name)+'</span></div>'+
   '<div class="stat"><small>All-time series</small><strong>'+sr[0]+'-'+sr[1]+'</strong><span>after this game</span></div>'+
   '<div class="stat"><small>Came in</small><strong>'+entering(g,g.lose)+'</strong><span>'+esc(M(g.lose).name)+'</span></div></div>'+
   '<div class="stat3" style="margin-top:8px"><div class="stat"><small>Week rank</small><strong>'+ord(rank(g.win))+'</strong><span>of '+ws.length+'</span></div><div class="stat"><small>League avg</small><strong>'+f1(avg)+'</strong><span>that week</span></div><div class="stat"><small>Week rank</small><strong>'+ord(rank(g.lose))+'</strong><span>of '+ws.length+'</span></div></div></section>';
  var mx=ws.length?ws[0].p:1;
  h+='<section class="panel"><div class="ph"><div><div class="kicker">'+g.s+' · Week '+g.w+'</div><h2>Every score that week</h2></div></div>'+
   ws.map(function(x,j){var hl=x.u===g.win||x.u===g.lose;return '<div class="wk'+(hl?' hl':'')+'"><span class="rk'+(j===0?' gold':'')+'" style="width:22px;height:22px;font-size:10px">'+(j+1)+'</span><div style="min-width:0"><b>'+esc(tnS(g.s,x.u))+'</b><div class="bar"><i style="width:'+(x.p/mx*100).toFixed(1)+'%"></i></div></div><span class="p">'+f2(x.p)+'</span></div>'}).join('')+'</section>';
  h+=LIVE?'<section class="panel"><div class="ph"><div><div class="kicker">Box score</div><h2>Lineups</h2></div></div><div id="lineups"><p class="muted">Loading lineups from Sleeper…</p></div></section>':
    '<p class="note"><b>Full lineups coming.</b> Every starter and bench player with their points loads straight from Sleeper once the app is live on Railway.</p>';
  return h;
}

function loadLineups(i){
  if(!LIVE)return;var g=D.games[i];
  fetch('/api/game?season='+g.s+'&week='+g.w+'&users='+g.win+','+g.lose).then(function(r){return r.json()}).then(function(d){
    var el=document.getElementById('lineups');if(!el)return;
    if(!d||!d.teams||d.error){el.innerHTML='<p class="err">Couldn\'t load lineups: '+esc(d&&d.error||'unknown error')+'</p>';return}
    el.innerHTML=lineupHtml(g,d);
  }).catch(function(){var el=document.getElementById('lineups');if(el)el.innerHTML='<p class="err">Couldn\'t reach the server for lineups.</p>'});
}
function lineupHtml(g,d){
  var A=d.teams[0],B=d.teams[1],n=Math.max(A.starters.length,B.starters.length);
  var pl=function(p,side){if(!p)return '<div class="pl '+side+'"></div>';return '<div class="pl '+side+'"><b>'+esc(p.name)+'</b><span>'+esc([p.pos,p.team].filter(Boolean).join(' · '))+'</span></div>'};
  var h='<div class="ln head"><span class="pl a">'+esc(tnS(g.s,g.win))+'</span><span></span><span></span><span></span><span class="pl b">'+esc(tnS(g.s,g.lose))+'</span></div>';
  for(var j=0;j<n;j++){var a=A.starters[j],b=B.starters[j],ap=a?a.pts:0,bp=b?b.pts:0;
    h+='<div class="ln">'+pl(a,'a')+'<span class="pp'+(ap>bp?' hi':'')+'">'+(a?f1(ap):'')+'</span><span class="slot">'+esc((a||b).slot.replace('SUPER_FLEX','SF').replace('FLEX','FLX'))+'</span><span class="pp'+(bp>ap?' hi':'')+'">'+(b?f1(bp):'')+'</span>'+pl(b,'b')+'</div>'}
  h+='<div class="ln tot"><span class="pl a">Total</span><span class="pp hi">'+f2(A.points)+'</span><span class="slot"></span><span class="pp">'+f2(B.points)+'</span><span class="pl b"></span></div>';
  var bench=function(t,u){var tot=t.bench.reduce(function(x,p){return x+p.pts},0);
    return '<details class="bench"><summary>'+esc(tnS(g.s,u))+' bench · '+f1(tot)+' pts</summary>'+t.bench.map(function(p){return '<div class="bn"><div class="pl a"><b>'+esc(p.name)+'</b><span>'+esc([p.pos,p.team].filter(Boolean).join(' · '))+'</span></div><span class="pp">'+f1(p.pts)+'</span></div>'}).join('')+'</details>'};
  return h+bench(A,g.win)+bench(B,g.lose);
}

/* ---------- sheets ---------- */
function openSheet(html){$('#sheetBody').innerHTML=html;$('#sheet').classList.add('open');$('#scrim').classList.add('open');$('#sheet').scrollTop=0}
function closeSheet(){$('#sheet').classList.remove('open');$('#scrim').classList.remove('open');if(S.slip){S.slip=null;render()}}
function slipHtml(){
  var p=S.slip,l=line(p.line),o=pickOdds(p),st=S.stake;var bad=!(st>=10&&st<=250)?'Bets are 10 to 250 Banana Bucks.':st>bank()?'Not enough Banana Bucks.':'';
  return '<div class="ph" style="margin:0"><div><div class="kicker">Bet slip · '+(p.mkt==='ml'?'Moneyline':p.mkt==='sp'?'Spread':'Total')+'</div><h2 style="font-size:20px">'+esc(pickLabel(p))+'</h2><p class="muted" style="font-size:12.5px;margin-top:2px">'+esc(team(l.a))+' vs '+esc(team(l.b))+' · '+odds(o)+'</p></div></div>'+
   '<div class="stake"><input id="stake" type="number" inputmode="numeric" min="10" max="250" step="5" value="'+st+'" aria-label="Stake in Banana Bucks"><span class="kicker">🍌 '+money(bank())+' left</span></div>'+
   '<div class="quick">'+[10,25,50,100,250].map(function(v){return '<button type="button" data-stake="'+v+'">'+v+'</button>'}).join('')+'</div>'+
   '<div class="towin"><span>To win</span><b id="towin">'+(bad?'–':money(profit(st,o)))+'</b></div>'+
   '<p class="err" id="slipErr">'+bad+'</p>'+
   '<button type="button" class="cta" id="place"'+(bad?' disabled':'')+'>Place bet</button><button type="button" class="ghost" id="cancelSlip">Cancel</button>';
}
function toast(t){var el=$('#toast');el.textContent=t;el.classList.add('show');clearTimeout(toast._t);toast._t=setTimeout(function(){el.classList.remove('show')},2200)}

/* ---------- render + events ---------- */
function render(){
  document.querySelectorAll('.tab').forEach(function(t){t.classList.toggle('on',t.dataset.tab===S.tab);t.setAttribute('aria-current',t.dataset.tab===S.tab?'page':'false')});
  view.innerHTML=S.tab==='home'?home():S.tab==='league'?league():S.tab==='records'?records():S.tab==='book'?book():me();
  $('#bucks').textContent=money(bank());
}
function go(tab,sub){S.tab=tab;if(tab==='league'&&sub)S.lseg=sub;render();window.scrollTo(0,0);try{history.replaceState(null,'','#'+tab)}catch(e){}}
document.addEventListener('click',function(e){
  var t=e.target.closest('button');if(!t)return;
  if(t.dataset.tab){go(t.dataset.tab);return}
  if(t.dataset.go){var p=t.dataset.go.split(':');go(p[0],p[1]);return}
  if(t.dataset.lseg){S.lseg=t.dataset.lseg;render();return}
  if(t.dataset.bseg){S.bseg=t.dataset.bseg;render();return}
  if(t.dataset.rec){S.rec=t.dataset.rec;render();t=document.querySelector('[data-rec="'+S.rec+'"]');if(t&&t.scrollIntoView)t.scrollIntoView({inline:'center',block:'nearest'});return}
  if(t.dataset.pick){var a=t.dataset.pick.split('|');S.slip={line:a[0],mkt:a[1],side:a[2]};render();openSheet(slipHtml());return}
  if(t.dataset.stake){S.stake=+t.dataset.stake;openSheet(slipHtml());return}
  if(t.id==='place'){S.bets.push({line:S.slip.line,mkt:S.slip.mkt,side:S.slip.side,stake:S.stake,at:Date.now()});store('bets',S.bets);var lbl=pickLabel(S.slip);S.slip=null;closeSheet();render();toast('Bet placed: '+lbl);return}
  if(t.id==='cancelSlip'){closeSheet();return}
  if(t.dataset.cancel!=null&&t.dataset.cancel!==undefined&&t.classList.contains('x')){S.bets.splice(+t.dataset.cancel,1);store('bets',S.bets);render();toast('Bet cancelled, Bucks returned');return}
  if(t.id==='bucksBtn'){go('book');return}
  if(t.dataset.game!==undefined){var gx=+t.dataset.game;if(gx>=0){openSheet(gameSheet(gx)+'<button type="button" class="ghost" id="closeP">Close</button>');loadLineups(gx);return}}
  if(t.dataset.mgr){openSheet(profile(t.dataset.mgr,false)+'<button type="button" class="ghost" id="closeP">Close</button>');return}
  if(t.id==='closeP'){closeSheet();return}
});
document.addEventListener('change',function(e){
  if(e.target.id==='meSel'){S.me=e.target.value;store('me',S.me);S.h2a=S.me;S.h2b=null;render();toast('Playing as '+team(S.me))}
  if(e.target.id==='h2a'){S.h2a=e.target.value;render()}
  if(e.target.id==='h2b'){S.h2b=e.target.value;render()}
});
document.addEventListener('input',function(e){
  if(e.target.id==='stake'){S.stake=Math.round(+e.target.value||0);var o=pickOdds(S.slip);var bad=!(S.stake>=10&&S.stake<=250)?'Bets are 10 to 250 Banana Bucks.':S.stake>bank()?'Not enough Banana Bucks.':'';
    $('#towin').textContent=bad?'–':money(profit(S.stake,o));$('#slipErr').textContent=bad;$('#place').disabled=!!bad}
});
$('#scrim').addEventListener('click',closeSheet);
document.addEventListener('keydown',function(e){if(e.key==='Escape')closeSheet()});
var h=(location.hash||'').replace('#','');if(['home','league','records','book','me'].indexOf(h)>=0)S.tab=h;
render();
})();
</script>
</body></html>
